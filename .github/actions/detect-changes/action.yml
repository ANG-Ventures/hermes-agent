name: Detect affected areas
description: >-
  Classify a PR's changed files into CI work lanes (python, frontend, site,
  scan, deps, mcp_catalog) so the orchestrator can conditionally call only
  the sub-workflows a PR can affect. Outputs are always "true" on push/dispatch
  events and fail open (everything "true") when the diff cannot be computed.

inputs:
  github-token:
    description: Token for the GitHub API (gh CLI). Pass steps.app-token.outputs.token from the calling workflow.
    required: false
    default: ${{ github.token }}

outputs:
  python:
    description: Run Python tests / ruff / ty / windows-footguns.
    value: ${{ steps.classify.outputs.python }}
  python_prod:
    description: Python changes outside tests/ — gates product jobs (Desktop E2E, Docker).
    value: ${{ steps.classify.outputs.python_prod }}
  frontend:
    description: Run the TypeScript testing matrix + desktop build.
    value: ${{ steps.classify.outputs.frontend }}
  docker_meta:
    description: Docker setup and meta files have changed.
    value: ${{ steps.classify.outputs.docker_meta }}
  docker:
    description: Files included in the docker image have changed.
    value: ${{ steps.classify.outputs.docker }}
  nix:
    description: Run `nix flake check` (flake inputs, or any product Python change).
    value: ${{ steps.classify.outputs.nix }}
  site:
    description: Build the Docusaurus docs site.
    value: ${{ steps.classify.outputs.site }}
  scan:
    description: Run the supply-chain critical-pattern scanner.
    value: ${{ steps.classify.outputs.scan }}
  deps:
    description: Check pyproject.toml dependency upper bounds.
    value: ${{ steps.classify.outputs.deps }}
  uv_lock:
    description: Run `uv lock --check` (pyproject.toml / uv.lock changes only).
    value: ${{ steps.classify.outputs.uv_lock }}
  npm_lock:
    description: Post/update the semantic package-lock.json diff PR comment.
    value: ${{ steps.classify.outputs.npm_lock }}
  installer:
    description: Run the PowerShell installer tests on a Windows runner.
    value: ${{ steps.classify.outputs.installer }}
  rust:
    description: Run `cargo test` for the Tauri bootstrap installer.
    value: ${{ steps.classify.outputs.rust }}
  mcp_catalog:
    description: Require MCP catalog security review label.
    value: ${{ steps.classify.outputs.mcp_catalog }}
  test_scope:
    description: Isolated plugin test scope, or fail-open full.
    value: ${{ steps.classify.outputs.test_scope }}
  changed_files:
    description: >-
      JSON list of the pull_request's changed paths, for the test-impact
      pre-filter in tests.yml. Always [] on every other event.
    value: ${{ steps.classify.outputs.changed_files }}
  ci_review:
    description: Require CI-sensitive file review label.
    value: ${{ steps.classify.outputs.ci_review }}
  ci_review_files:
    description: JSON list of CI-sensitive files changed by the pull request.
    value: ${{ steps.classify.outputs.ci_review_files }}

runs:
  using: composite
  steps:
    - name: Classify changed files
      id: classify
      shell: bash
      env:
        # Fall back to the built-in read-only token when the caller passes an
        # empty value. Fork PRs get no repo secrets, so AUTOFIX_BOT_PAT is ""
        # there, and an input `default:` only applies when the input is omitted,
        # not when it's passed empty. Without this fallback the compare API
        # fails on forks and the classifier fails open (every lane forced on).
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        REPO: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # NOT merge_group.base_sha — see the SAFETY ARGUMENT below. base_sha is
        # the PREVIOUS queue candidate, not the target branch.
        MG_BASE_REF: ${{ github.event.merge_group.base_ref }}
        MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
      run: |
        set -euo pipefail

        # Which events get a real diff, and which fail open to "run everything".
        #
        # pull_request — base.sha...head.sha, pinned at trigger time.
        #
        # merge_group  — base_REF...head_sha. The base REF (the branch the queue
        #   is merging into, e.g. `refs/heads/main`), deliberately NOT the
        #   payload's `base_sha`.
        #
        #   WHY NOT base_sha — measured, 2026-09-19, ANG-Ventures/hermes-agent.
        #   Queue candidate refs are CHAINED, not each rooted at the target
        #   branch: with 5 entries queued, `git ls-remote fork
        #   'refs/heads/gh-readonly-queue/*'` showed each candidate's base_sha
        #   equal to the PREVIOUS candidate's head, four deep above main
        #   (`git rev-list --count 5f723580..4c506554` = 4). So
        #   diff(base_sha, head_sha) is only the TOPMOST entry's own delta, not
        #   the batch. On the candidate that actually fast-forwards main
        #   (175d6be2) that pair yields 3 files while the true incoming set is
        #   12 — gateway/platforms/base.py and plugins/platforms/discord/
        #   adapter.py would have landed with their lanes never run on the tree
        #   that merges. Every multi-entry candidate in that queue under-reported
        #   (payload-base vs target-base file counts: 1/1, 2/3, 4/7, 3/10, 3/12).
        #
        #   SAFETY ARGUMENT — why narrowing on base_ref cannot under-test any
        #   member PR. `compare/<base_ref>...<head_sha>` is three-dot: GitHub
        #   resolves the merge base of the target branch and the candidate, and
        #   reports the candidate's side only. The candidate contains EVERY
        #   member PR of the batch stacked on the target branch, so that path
        #   set is the UNION of the member PRs' diffs as projected onto the tree
        #   that is about to become main — every path any member touches appears
        #   in it (a path two members both touch appears once; a path one member
        #   touches and another reverts still appears if the net differs from
        #   base, and if the net is IDENTICAL to base then no member's change to
        #   it survives into main, so nothing untested merges). Three-dot also
        #   means commits that land on the target branch after the batch was
        #   cut are NOT attributed to this batch. Lane selection is a monotone
        #   OR over that path set: lanes(A ∪ B) ⊇ lanes(A) ∪ lanes(B) for every
        #   lane in classify_changes.py, because each lane is
        #   `any(predicate(f) for f in files)` and the fail-open overrides (empty
        #   diff, any `.github/` path) only ever force lanes ON. Therefore the
        #   batch runs at least every lane each member would have run alone.
        #
        #   The same monotonicity does NOT hold for TEST_SCOPE: the plugin scope
        #   is a narrowing (`plugin:<name>`), not an OR. But it is safe for the
        #   opposite reason — _plugin_scope_from_changes() fails open to `full`
        #   the moment the path set spans more than one plugin tree or contains
        #   any non-plugin path, so a union of two members can only ever be
        #   EQUAL to (single plugin, all members in it) or WIDER (`full`) than
        #   either member's own scope. It can never resolve to a plugin scope no
        #   member had.
        #
        # everything else (push to main, release, dispatch, schedule) — no SHAs
        #   are exported, CHANGED stays empty, every lane runs and TEST_SCOPE
        #   stays `full`. Post-merge / on-demand validation is never weakened.
        #
        # A malformed or absent payload fails OPEN: the guards below reject
        # anything that is not a full SHA pair (pull_request) or a
        # refs/heads/<branch> + 40-hex head pair (merge_group), which leaves
        # BASE_REV / HEAD_SHA empty and takes the same path as push.
        # `CHANGED` must be declared before the gate: under `set -u` the
        # fail-open path reaches the `-n "$CHANGED"` test below without ever
        # entering the compare block.
        CHANGED=""
        BASE_REV=""
        HEAD_SHA=""
        # 40-hex / ref validation with bash regexes (the step declares
        # `shell: bash`). Deliberately NOT `grep`: under `set -e` a non-matching
        # grep aborts the step, and a malformed payload must fail OPEN, not fail
        # the job.
        _sha_re='^[0-9a-f]{40}$'
        # Conservative branch-name charset. A ref that does not match (tag,
        # empty, or anything with shell/URL-hostile characters) fails open
        # rather than being interpolated into the compare path.
        _branch_re='^refs/heads/[A-Za-z0-9._/-]+$'
        case "$EVENT_NAME" in
          pull_request)
            if [[ "$PR_BASE_SHA" =~ $_sha_re ]] && [[ "$PR_HEAD_SHA" =~ $_sha_re ]]; then
              BASE_REV="$PR_BASE_SHA"; HEAD_SHA="$PR_HEAD_SHA"
            elif [ -n "${PR_BASE_SHA}${PR_HEAD_SHA}" ]; then
              echo "::warning::pull_request: malformed base/head SHAs (base='${PR_BASE_SHA}' head='${PR_HEAD_SHA}') — failing open (all lanes run)"
            fi
            ;;
          merge_group)
            if [[ "$MG_BASE_REF" =~ $_branch_re ]] && [[ "$MG_HEAD_SHA" =~ $_sha_re ]]; then
              # Strip refs/heads/ — the compare endpoint takes a branch name.
              BASE_REV="${MG_BASE_REF#refs/heads/}"; HEAD_SHA="$MG_HEAD_SHA"
            elif [ -n "${MG_BASE_REF}${MG_HEAD_SHA}" ]; then
              echo "::warning::merge_group: malformed base_ref/head_sha (base_ref='${MG_BASE_REF}' head='${MG_HEAD_SHA}') — failing open (all lanes run)"
            fi
            ;;
        esac

        if [ -n "$BASE_REV" ] && [ -n "$HEAD_SHA" ]; then
          # Use the compare endpoint with the base/head resolved above instead
          # of the "current PR files" endpoint. On pull_request both sides are
          # SHAs pinned at trigger time, so the file list is deterministic even
          # if the PR receives a new push between trigger and detect. On
          # merge_group the base is the target BRANCH and the head is the
          # candidate SHA, which makes the compare three-dot against the merge
          # base — the batch's union (see the safety argument above).
          #
          # Retried: a rate-limit blip or eventual-consistency 404 on a
          # freshly-pushed HEAD would otherwise silently fall open (all lanes
          # run — safe, but wasteful and it masks the API failure).
          #
          # `.files[]?` (null-safe): with --paginate, a PR more than 100
          # commits ahead of its merge-base paginates the compare, and pages
          # after the first carry `files: null` — bare `.files[]` makes jq
          # die with "cannot iterate over: null", which fails every retry
          # and forces the fail-open path (seen on stacked PRs). The full
          # file list (up to the API's 300-file cap) is on page one.
          #
          # `.previous_filename` (fork): also surface a renamed file's OLD path
          # so a rename touches the lanes that owned either path.
          CHANGED=""
          for i in 1 2 3; do
            if CHANGED="$(gh api \
              --paginate \
              "repos/${REPO}/compare/${BASE_REV}...${HEAD_SHA}" \
              --jq '.files[]? | .filename, (.previous_filename // empty)')"; then
              break
            fi
            if [ "$i" = 3 ]; then
              echo "::warning::compare API failed after 3 attempts — failing open (all lanes run)"
              CHANGED=""
              break
            fi
            echo "::warning::compare API failed (attempt $i); retrying in 10s"
            sleep 10
          done
        fi

        echo "Changed files:"
        printf '%s\n' "${CHANGED:-(none)}"
        printf '%s\n' "${CHANGED:-}" | python3 scripts/ci/classify_changes.py

        TEST_SCOPE=full
        if [ -n "$CHANGED" ]; then
          # Same gate as the lane classifier: CHANGED is only non-empty when a
          # real base...head diff was resolved (pull_request or merge_group).
          TEST_SCOPE="$(printf '%s\n' "$CHANGED" | \
            python3 scripts/run_tests_parallel.py --changed-files-scope || true)"
        fi
        case "$TEST_SCOPE" in
          full|plugin:*) ;;
          *) TEST_SCOPE=full ;;
        esac
        echo "test_scope=$TEST_SCOPE" | tee -a "$GITHUB_OUTPUT"

        # pull_request only: the PR run narrows to test-impact-selected files
        # (scripts/ci/test_impact.py). merge_group and push never get a list,
        # so the gate always runs the full matrix.
        CHANGED_JSON='[]'
        if [ "$EVENT_NAME" = pull_request ] && [ -n "$CHANGED" ]; then
          CHANGED_JSON="$(printf '%s\n' "$CHANGED" | python3 -c 'import json, sys; print(json.dumps([p for p in sys.stdin.read().splitlines() if p.strip()]))')"
        fi
        echo "changed_files=$CHANGED_JSON" >> "$GITHUB_OUTPUT"
