name: CI

# Orchestrator workflow. Runs ``detect-changes`` once, then conditionally
# calls the sub-workflows that a PR can actually affect. A final
# ``all-checks-pass`` gate job aggregates results so branch protection only
# needs to require a single check.
#
# Sub-workflows are triggered via ``workflow_call`` and keep their own job
# definitions, matrices, and concurrency settings. They no longer have
# ``push:`` / ``pull_request:`` triggers of their own — everything flows
# through this file.
#
# SECURITY: this workflow runs PR-controlled actions, workflows, and code.
# Do not add ``secrets: inherit`` or GitHub App credentials here. Trusted
# main-only automation uses protected environments in its own workflows.
#
# RUNNERS (fork, 2026-09-16). Heavy portable jobs use
# ``vars.CI_RUNNER_LABELS`` for self-hosted/hosted evacuation; cheap required
# gates (sast, secret_scan, review-label, supply-chain pattern scan, lint)
# use literal ``ubuntu-latest`` so a pool outage cannot strand those checks. The pool runs
# ephemeral containers with ``--security-opt no-new-privileges`` and no docker
# socket, which is why a handful of jobs are pinned to ``ubuntu-latest``
# instead and carry a comment naming the reason at their ``runs-on``:
#
#   nix.yml         nix install needs root (cachix/install-nix-action uses sudo)
#   rust-tests.yml  sudo apt-get for webkit2gtk; the pool image ships none
#   e2e-desktop.yml sudo apt-get for gtk/nss/xvfb
#   docker-lint.yml hadolint is a Docker container action; no socket on the pool
#   js-tests.yml    mid-flight vitest death, not root-caused; see js-tests.yml
#
# ``installer-tests`` and the ``tests-os`` matrix use a
# literal ``runs-on`` and are hosted by design. Further hosted pins are listed
# below. Any PR touching ``.github/workflows/**`` also needs the ``ci-reviewed``
# label or the Review label gate hard-blocks it.
#
# OVERFLOW (2026-09-20). The pool has 17 slots (ace-ai 8 + ace-media 8 +
# studio 1) and a PR/merge_group run wanted 26 of them — 16 test slices plus
# 10 non-test jobs — so jobs queued 4.6 min on average (max 14.4) to run for
# 3.3. GitHub cannot spill a full self-hosted pool onto hosted runners by
# itself, so two things changed:
#
#   * tests.yml stamps a PER-SLICE ``runs_on`` in its ``generate`` job:
#     slices 1..``vars.CI_SELF_HOSTED_SLOTS`` take ``CI_RUNNER_LABELS``, the
#     rest take ``ubuntu-latest``. Unset slot count = no cap = every slice
#     self-hosted, so the variable is a no-op until it is set.
#   * the short non-test jobs that gate nothing on the LAN — lint (x3),
#     uv-lockfile-check, contributor-check, docs-site-checks — moved to a
#     literal ``ubuntu-latest``, freeing 6 pool slots per run for test slices.
#   * gate/plumbing jobs (detect, generate, all-checks-pass, ci-timings,
#     save-durations, OSV emit-status) are also pinned hosted. The required
#     aggregator queued 17+ minutes behind test slices after they finished;
#     these GitHub API/artifact and local Python jobs need no LAN resources.
#
# ``CI_RUNNER_LABELS`` rollback still sends the heavy variable-routed jobs,
# including the matrix slices, to ubuntu-latest. Literal hosted gates stay hosted.

on:
  pull_request:
  push:
    branches: [main]
  # merge_group: the merge queue creates a temporary batched branch and fires
  # this event; the required checks must run on it or the queue wedges forever.
  # The detect-changes classifier resolves a REAL diff here, three-dot from the
  # TARGET BRANCH (github.event.merge_group.base_ref) to the candidate head —
  # deliberately NOT merge_group.base_sha, which is the previous chained queue
  # candidate and yields only the topmost entry's delta. The three-dot diff is
  # the union of the batch's member PRs, so lane selection over it cannot
  # under-test any member (the full argument, with the measurement, lives in
  # .github/actions/detect-changes/action.yml).
  # A malformed/absent payload still fails open to the full matrix, and every
  # other non-PR event (push to main, release, dispatch) is untouched: no base
  # resolved, empty diff, every lane true.
  merge_group:

permissions:
  contents: read
  pull-requests: write # needed by lint (PR comment) + supply-chain review_status
  actions: read # needed by osv-scanner (SARIF upload)
  security-events: write # needed by osv-scanner (SARIF upload)

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on BOTH pull_request and merge_group.
  #
  # merge_group was previously excluded, which stranded a full 44-job run every
  # time the queue reshuffled: GitHub creates a NEW gh-readonly-queue/... branch
  # per batch candidate, the old batch's run stays queued forever, and those
  # orphans keep competing for the self-hosted ACE-AI pool. Measured 2026-09-19:
  # 17 orphaned merge_group runs across PRs 711/712/715/716 (already evicted from
  # the queue) starved a seconds-long `all-checks-pass` rollup job for 3.5 hours,
  # blocking PR #713 behind head-of-line contention on a pool that was otherwise
  # healthy and cycling normally.
  #
  # Safe because `group` is keyed on github.ref: each queue batch has its own
  # unique gh-readonly-queue ref, so cancelling only ever kills a run whose ref
  # is being superseded — never a live sibling batch. push-to-main keeps its
  # no-cancel behaviour (main's history must be fully verified).
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # detect: run the classifier once. Every downstream job reads its outputs
  # to decide whether to run. On push/dispatch the classifier fails open
  # (all lanes true) so post-merge validation is never weakened.
  # ─────────────────────────────────────────────────────────────────────
  detect:
    name: Detect affected areas
    # Unblock all lanes without waiting for a self-hosted test slot.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      python: ${{ steps.classify.outputs.python }}
      python_prod: ${{ steps.classify.outputs.python_prod }}
      frontend: ${{ steps.classify.outputs.frontend }}
      site: ${{ steps.classify.outputs.site }}
      scan: ${{ steps.classify.outputs.scan }}
      deps: ${{ steps.classify.outputs.deps }}
      uv_lock: ${{ steps.classify.outputs.uv_lock }}
      npm_lock: ${{ steps.classify.outputs.npm_lock }}
      installer: ${{ steps.classify.outputs.installer }}
      rust: ${{ steps.classify.outputs.rust }}
      docker_meta: ${{ steps.classify.outputs.docker_meta }}
      mcp_catalog: ${{ steps.classify.outputs.mcp_catalog }}
      test_scope: ${{ steps.classify.outputs.test_scope }}
      ci_review: ${{ steps.classify.outputs.ci_review }}
      ci_review_files: ${{ steps.classify.outputs.ci_review_files }}
      event_name: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Detect affected areas
        id: classify
        uses: ./.github/actions/detect-changes
        with:
          sparse-checkout: scripts/ci/classify_changes.py
          sparse-checkout-cone-mode: false
          github-token: ${{ github.token }}

  # ─────────────────────────────────────────────────────────────────────
  # Lane-gated sub-workflows. Each runs in parallel after detect finishes.
  # Skipped workflows (if condition is false) don't spin up runners.
  # ─────────────────────────────────────────────────────────────────────
  tests:
    name: Python tests
    needs: detect
    if: needs.detect.outputs.python == 'true'
    uses: ./.github/workflows/tests.yml
    with:
      # 2026-09-09: 12 -> 16. On the fork's hosted 4-vCPU runners every exit-143
      # "runner received a shutdown signal" death this week (9 jobs, 09-08..09-09)
      # hit a slice that had already run 412-784 s; the passing distribution is
      # 4-6 min. Shorter slices keep each job out of that window. Three PRs
      # (#651 x2, #660) were blocked by it with no test actually failing.
      #
      # 2026-09-24 (t_41004cb2): merge_group runs 8, pull_request keeps 16.
      # The queue run is the only gate (the ruleset has no PR status checks),
      # and all CI jobs share the 60-concurrent hosted cap: 13 in-flight
      # runs at ~20 jobs held the queue at 0 merges in 40 min. Halving the
      # gate's matrix halves its share of that cap.
      #
      # 2026-09-25 (t_f447539b, dynamic CI slots): merge_group follows the LIVE
      # self-hosted slot total, which ci-placement writes to
      # vars.CI_MERGE_GROUP_SLICES through scripts/ci_routing_ledger.py (the only
      # sanctioned writer). A 16-slice matrix onto 5 live slots just queues.
      # Clamped 4..16 here AND in ci-overflow-controller `slice_counts`; unset
      # = 8, today's value, so this is a no-op until placement is armed.
      slice_count: ${{ github.event_name == 'merge_group' && (vars.CI_MERGE_GROUP_SLICES == '' && 8 || (fromJSON(vars.CI_MERGE_GROUP_SLICES) < 4 && 4 || (fromJSON(vars.CI_MERGE_GROUP_SLICES) > 16 && 16 || fromJSON(vars.CI_MERGE_GROUP_SLICES)))) || 16 }}
      test_scope: ${{ needs.detect.outputs.test_scope }}

  # macOS + Windows lanes. The main `tests` lane above is Linux-only, and
  # the OS-marked tests it collects are skipped there by design (see the
  # `_OS_MARKS` comment in tests/conftest.py) — this is where they run.
  # Same `python` lane gate: if no Python changed, neither runs.
  tests-os:
    name: OS-specific tests
    needs: detect
    if: needs.detect.outputs.python == 'true'
    uses: ./.github/workflows/tests-os.yml

  lint:
    name: Python lints
    needs: detect
    if: needs.detect.outputs.python == 'true'
    uses: ./.github/workflows/lint.yml
    with:
      event_name: ${{ needs.detect.outputs.event_name }}

  js-tests:
    name: JS & TS checks
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    uses: ./.github/workflows/js-tests.yml

  installer-tests:
    name: Installer tests
    needs: detect
    # Windows-only, and only for PRs that touch install.ps1 or its tests.
    if: needs.detect.outputs.installer == 'true'
    uses: ./.github/workflows/installer-tests.yml

  rust-tests:
    name: Rust tests
    needs: detect
    # Only for PRs that touch a Rust crate. `.rs` is under apps/, so these
    # changes used to run the TypeScript matrix and nothing that compiles them.
    if: needs.detect.outputs.rust == 'true'
    uses: ./.github/workflows/rust-tests.yml

  e2e-desktop:
    name: Desktop E2E
    needs: detect
    # python_prod (not python): the Playwright suite exercises the built app
    # + `hermes serve` backend, which never import anything under tests/.
    #
    # ⛔ DISABLED — upstream's guard (their #76627: after the Aug 1 engines/npm
    # churn the mock-backend Electron window never gets a title, so boot/chat/
    # setup specs all fail identically regardless of the diff).
    #
    # fork-parity note: I briefly restored the fork's condition here because
    # `Desktop E2E` concludes SUCCESS on fork/main (runs 31280614721 /
    # 31278775668) — which looked like proof upstream's premise was false here.
    # It was the wrong inference. fork/main still carries the FORK's desktop
    # tree (17 specs); this branch retires that fork and takes upstream's
    # apps/desktop verbatim (19 specs, byte-identical to upstream/main), so it
    # inherits upstream's BROKEN suite too. Re-enabling reproduced their exact
    # symptom and blew the 20-minute cap at 20m20s:
    #   ✘ e2e/boot.spec.ts › window opens with Hermes title
    #   ✘ e2e/boot.spec.ts › renderer mounts and shows DOM content
    #   ✘ e2e/chat.spec.ts › send a message and receive a response
    # Green on fork/main measured the fork's suite, not this one.
    #
    # This job is intentionally SKIPPED, and scripts/ci/evaluate_needs.py has a
    # matching exemption so the skip is declared rather than silent (the #476
    # rule is 'no required job vanishes unnoticed', not 'never skip').
    # Re-enable together with upstream's #76627 fix.
    if: ${{ false && (needs.detect.outputs.python_prod == 'true' || needs.detect.outputs.frontend == 'true') }}
    uses: ./.github/workflows/e2e-desktop.yml

  docs-site:
    name: Docs Site
    needs: detect
    if: needs.detect.outputs.site == 'true'
    uses: ./.github/workflows/docs-site-checks.yml

  history-check:
    name: Deny unrelated histories
    needs: detect
    if: needs.detect.outputs.event_name == 'pull_request'
    uses: ./.github/workflows/history-check.yml

  contributor-check:
    name: Check contributors
    needs: detect
    if: needs.detect.outputs.python == 'true'
    uses: ./.github/workflows/contributor-check.yml

  uv-lockfile:
    name: Check uv.lock
    needs: detect
    # Gated: `uv lock --check` re-resolves the whole dependency graph against
    # PyPI, so on every PR it spent a network round-trip — and, on a registry
    # blip, a blocking red X — for diffs that cannot desync the lockfile
    # (docs, frontend, prose). Only pyproject.toml / uv.lock can. A
    # `.github/` change still forces it on via the classifier's fail-open.
    if: needs.detect.outputs.uv_lock == 'true'
    uses: ./.github/workflows/uv-lockfile-check.yml

  infographic-check:
    name: Check no committed infographics
    needs: detect
    uses: ./.github/workflows/infographic-check.yml

  lockfile-diff:
    name: package-lock.json diff
    needs: detect
    if: needs.detect.outputs.event_name == 'pull_request' && needs.detect.outputs.npm_lock == 'true'
    uses: ./.github/workflows/lockfile-diff.yml

  docker-lint:
    name: Lint Docker scripts
    needs: detect
    if: needs.detect.outputs.docker_meta == 'true'
    uses: ./.github/workflows/docker-lint.yml

  supply-chain:
    name: Supply-chain scan
    needs: detect
    if: needs.detect.outputs.event_name == 'pull_request' && (needs.detect.outputs.scan == 'true' || needs.detect.outputs.deps == 'true')
    uses: ./.github/workflows/supply-chain-audit.yml
    with:
      event_name: ${{ needs.detect.outputs.event_name }}
      scan: ${{ needs.detect.outputs.scan == 'true' }}
      deps: ${{ needs.detect.outputs.deps == 'true' }}

  review-labels:
    name: Review label gate
    needs: [detect, supply-chain]
    if: always() && needs.detect.outputs.event_name == 'pull_request' && (needs.detect.outputs.ci_review == 'true' || needs.detect.outputs.mcp_catalog == 'true' || needs.supply-chain.outputs.critical_findings == 'true')
    uses: ./.github/workflows/review-labels.yml
    with:
      ci_review: ${{ needs.detect.outputs.ci_review == 'true' }}
      ci_review_files: ${{ needs.detect.outputs.ci_review_files }}
      mcp_catalog: ${{ needs.detect.outputs.mcp_catalog == 'true' }}
      supply_chain: ${{ needs.supply-chain.outputs.critical_findings == 'true' }}

  osv-scanner:
    name: OSV scan
    uses: ./.github/workflows/osv-scanner.yml

  # ─────────────────────────────────────────────────────────────────────
  # Gate: runs after everything. ``if: always()`` ensures it reports a
  # status even when some deps were skipped. Only ``success`` and a
  # classifier-consistent ``skipped`` result pass the gate.
  #
  # Branch protection should require ONLY this check.
  #
  # Outputs ``needs-json`` — a compact ``{job_name: result}`` dict — so
  # the live comment poller can list failed jobs in the PR comment.
  # ─────────────────────────────────────────────────────────────────────
  all-checks-pass:
    name: All required checks pass
    needs:
      - detect
      - tests
      - tests-os
      - lint
      - js-tests
      - installer-tests
      - rust-tests
      - e2e-desktop
      - docs-site
      - history-check
      - contributor-check
      - uv-lockfile
      - lockfile-diff
      - docker-lint
      - supply-chain
      - review-labels
      - osv-scanner
      # The image build runs in its own workflow (docker.yml) and reports
      # its own check. It was never required here, because it is too slow
      # to block a merge. A separate run also stops it from holding this
      # run open. That is what blocked ``gh run rerun``.
    if: always()
    # A completed matrix must not wait for the pool to report its verdict.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needs-json: ${{ steps.evaluate.outputs.needs-json }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Evaluate job results
        id: evaluate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 scripts/ci/evaluate_needs.py

  # ─────────────────────────────────────────────────────────────────────
  # CI timing report: collect per-job/step durations from the GitHub API,
  # cache them on main (as a baseline), and on PRs generate an HTML diff
  # report with a gantt chart + per-step breakdown. The report is uploaded
  # as an artifact and a markdown summary is written to $GITHUB_STEP_SUMMARY.
  #
  # The live comment poller dynamically fetches all review-status-* artifacts
  # across the orchestrator and sub-workflow runs every cycle, so its link
  # points straight at that report.
  # ─────────────────────────────────────────────────────────────────────
  ci-timings:
    name: CI timing report
    needs: [all-checks-pass]
    if: always()
    # GitHub API/cache/artifacts only; reserve pool slots for tests.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore baseline cache (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ci-timings-baseline.json
          # Prefix-match: exact key will never hit (run_id differs), so
          # restore-keys finds the most recent baseline from main.
          key: ci-timings-baseline-never-exact
          restore-keys: |
            ci-timings-baseline-

      - name: Collect timings and generate report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/timings_report.py \
            --baseline ci-timings-baseline.json \
            --output ci-timings-report.html \
            --json-out ci-timings.json \
            --summary-out ci-timings-summary.md

      - name: Upload HTML report
        # Advisory report — artifact-service blips must not fail the job.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: ci-timings-html
        with:
          name: ci-timings-report
          path: ci-timings-report.html
          retention-days: 14

      - name: Build linked review status
        if: hashFiles('ci-timings.json') != ''
        env:
          CI_TIMINGS_REPORT_URL: ${{ steps.ci-timings-html.outputs.artifact-url }}
        run: |
          python3 scripts/ci/timings_report.py \
            --from-json ci-timings.json \
            --baseline ci-timings-baseline.json \
            --review-status-out review-status.json \
            --review-status-only

      - name: Upload review status
        if: hashFiles('review-status.json') != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-status-ci-timings
          path: review-status.json
          retention-days: 14

      - name: Output summary
        env:
          REPORT_URL: ${{ steps.ci-timings-html.outputs.artifact-url}}
        run: |
          {
            echo "# CI Timing report"
            echo "[View the full interactive report]($REPORT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
          cat ci-timings-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save baseline cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Degraded runs (API rate-limited) produce no ci-timings.json —
          # skip rather than fail, and never cache an empty baseline.
          if [ -f ci-timings.json ]; then
            cp ci-timings.json ci-timings-baseline.json
          else
            echo "No timings JSON this run — skipping baseline update"
          fi

      - name: Upload baseline to cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('ci-timings-baseline.json') != ''
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ci-timings-baseline.json
          key: ci-timings-baseline-${{ github.run_id }}
