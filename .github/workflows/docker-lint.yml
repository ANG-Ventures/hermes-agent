name: Docker / shell lint

# Lints the container build inputs: Dockerfile (via hadolint) and any shell
# scripts under docker/ (via shellcheck). These catch the class of regression
# the behavioral docker smoke test can't — unquoted variable
# expansions, silently-failing RUN commands, etc.
#
# Rules and ignores are documented in .hadolint.yaml at the repo root.
# shellcheck severity is pinned to `error` so SC1091-style "can't follow
# sourced script" info-level warnings don't fail the job — the .venv
# activate script doesn't exist at lint time.

on:
  workflow_call:

permissions:
  contents: read

# push:main keys by run_id and never cancels: under CI_MAIN_GROUP_PER_SHA two
# main runs are live at once and a shared ref group would cancel one's child.
concurrency:
  group: docker-lint-${{ (github.ref_type == 'tag' || github.ref == 'refs/heads/main') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/main' }}

jobs:
  hadolint:
    name: Lint Dockerfile (hadolint)
    # fork 2026-09-16: NOT routed through CI_RUNNER_LABELS. hadolint-action is a
    # Docker *container* action, so the runner must `docker build` it before the
    # step can run. The ACE-AI self-hosted pool deliberately mounts no docker
    # socket (the pool is hardened and is not meant to build images), so the
    # step dies with "failed to connect to the docker API at
    # unix:///var/run/docker.sock". The shellcheck job below is a JS action with
    # no container, so it stays on the pool. Stays GitHub-hosted.
    # ci-priv (t_df855b2a): on the private CI mirror, CI_PRIV_ENABLED + CI_PRIV_RUNNER move this job to the
    # ci-priv class (a fresh KVM guest per job: real sudo + its own docker daemon; fleet-ops-scripts
    # ci-runners/ci-priv). Trusted events only. Both vars unset (the fork) -> ubuntu-latest.
    runs-on: ${{ vars.CI_PRIV_ENABLED == 'true' && vars.CI_PRIV_RUNNER && (github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_PRIV_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

      - name: hadolint (sandbox desktop image)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: docker/sandbox-desktop.Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

  shellcheck:
    name: Lint docker/ shell scripts (shellcheck)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 360  # R1: ceiling, overrun pages (t_48fd37d3)
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        env:
          # Severity = error: SC1091 (can't follow sourced script) is info-
          # level and would otherwise fail when the venv activate script
          # doesn't exist at lint time.
          SHELLCHECK_OPTS: --severity=error
        with:
          scandir: ./docker
