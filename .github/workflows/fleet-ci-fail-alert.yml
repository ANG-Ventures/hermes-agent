# Fleet-added (Apollo). NOT upstream — do not expect on NousResearch/hermes-agent.
# Fires a single LOUD ping to the fleet #alerts channel ONLY when a real CI
# workflow concludes in failure. The failure-filter lives HERE (`if: failure`)
# because the Hermes webhook adapter filters by event TYPE only, not payload
# conclusion — a deliver_only route on raw check_suite/status would also fire on
# SUCCESS and re-create the flood this replaces. Zero-LLM: the receiver route is
# deliver_only, so this is a pure notification, never an agent run.
name: Fleet CI-fail alert

on:
  # SWEEP, not a workflow_run listener (t_8ca8c919, ci-redundancy-audit class I). A listener is one run
  # of this workflow per upstream run: 2026-10-04 it was 1,039 runs, 967 skipped at the job `if:`, 38 %
  # of the 2,762 runs GitHub counted the day before it disabled this repo's Actions (its abuse
  # heuristics count runs). Every 15 minutes the sweep job lists the CFA_WATCHED workflows' red runs
  # and runs the unchanged route + POST steps once per red (`notify <run id>#<attempt>` matrix legs).
  schedule:
    - cron: '*/15 * * * *'
  # Proof path (t_957f5398): replay an EXISTING upstream run through the same
  # gate + POST code. The run is fetched from the API and fed to the identical
  # route step, so a replayed red merge_group run pages exactly as it would
  # live, and a replayed branch red stays silent. Nothing is re-run.
  workflow_dispatch:
    inputs:
      run_id:
        description: "Upstream workflow run id to replay through the page gate"
        required: true
        type: string

permissions:
  contents: read
  actions: read # the sweep lists runs + jobs; the route step reads the failed workflow's previous run

# One sweep at a time: a sweep reads its predecessors' `notify` legs, so two in flight could both
# notify one red. A replay is its own group.
concurrency:
  group: fleet-ci-fail-alert-${{ github.event_name == 'schedule' && 'sweep' || github.run_id }}
  cancel-in-progress: false

jobs:
  sweep:
    name: sweep
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 8
    outputs:
      runs: ${{ steps.find.outputs.runs }}
      default_branch: ${{ steps.find.outputs.default_branch }}
    steps:
      - name: Find the watched workflows' unnotified red runs
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REPLAY_RUN_ID: ${{ inputs.run_id }}
          # A red is a candidate when it COMPLETED (updated_at) within LOOKBACK_S before the last green
          # sweep started (now, if none in 24 h), so a late or failed sweep is covered by the next one.
          # Runs CREATED in the last 24 h are listed: a re-run keeps its run's created_at.
          LOOKBACK_S: "10800"
          # The workflows whose reds reach the page gate. One name per line (hermes-home
          # scripts/main-red-summary.py and scripts/ci_speed_lint.py read this list). workflow_run only
          # fired for TOP-LEVEL workflows; a sweep sees every run, but a workflow_call child's red is
          # still its parent's run, so list the parent.
          # workflow_run only fires for TOP-LEVEL workflows. "Tests" and "Lint (ruff + ty)"
          # became workflow_call-only reusables on 2026-06-23 (05c896cf52) and never emit
          # this event; their parent "CI" does. Measured 2026-09-20: 100/100 alert runs
          # skipped, and a red main (c93bfcc1, 07:18Z) paged nobody.
          # ci-local.yaml: the fallback orchestrator that replaces "CI" while ci.yaml is
          # disabled. Keep both names so the swap and the swap back both stay paged.
          # Non-gating detector (spec L6): PR runs are paths-scoped, so a flake
          # break from a source-only change first shows on push:main. Page it.
          # Weekly flake digest (t_162ffd04): red = a flake qualifies for
          # quarantine but has no fix card + owner yet.
          # Scheduled / dispatch workflows: a red run otherwise pages nobody
          # (ci-speed-lint R5). The three NousResearch-guarded ones are skipped on
          # the fork, so they only notify if that guard is ever lifted.
          # Synthetic P4 bench probe (t_c58e7200). Bench waves stay silent here;
          # see the PLACEMENT PROBE gate in the route step.
          CFA_WATCHED: |
            CI
            CI (local fallback)
            Fleet SAST (semgrep)
            Fleet Secret Scan (gitleaks)
            OSV-Scanner
            Supply Chain Audit
            Nix flake check
            Flake quarantine digest
            Install & Update E2E
            auto-fix lint issues & formatting
            Deploy Site
            Build Skills Index
            Skills Index Freshness Check
            CI placement probe
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            [[ "$REPLAY_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::run_id must be a run id"; exit 1; }
            echo "runs=[{\"id\":$REPLAY_RUN_ID,\"key\":\"replay\"}]" | tee -a "$GITHUB_OUTPUT"
            echo "default_branch=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO" | jq -er .default_branch)" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          api() { timeout "${API_CALL_S:-75}" curl -fsS --retry 2 --retry-max-time 40 --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/$1"; }
          pages() {  # list path -> one JSON array of every .workflow_runs item; rc!=0 on an API error or > 1000 runs
            local p=1 acc='[]' resp n
            while :; do
              resp="$(api "$1&per_page=100&page=$p")" || return 1
              n="$(jq -e '.workflow_runs | length' <<< "$resp")" || return 1
              acc="$(printf '%s\n%s' "$acc" "$resp" | jq -cs '.[0] + .[1].workflow_runs')" || return 1
              [ "$n" -lt 100 ] && break
              [ "$p" -lt 10 ] || return 1
              p=$((p + 1))
            done
            printf '%s\n' "$acc"
          }
          iso() { jq -nr --argjson t "$1" '$t | todate'; }
          epoch() { jq -nr --arg d "$1" '$d | fromdate'; }
          NOW="${SWEEP_NOW:-$(date -u +%s)}"
          SELF="$(api "actions/runs/$GITHUB_RUN_ID" | jq -er .workflow_id)"
          SWEEPS="$(pages "actions/workflows/$SELF/runs?event=schedule&created=%3E%3D$(iso $((NOW - 86400)))")"
          LAST_OK="$(jq -r --argjson me "$GITHUB_RUN_ID" '[.[] | select(.id != $me and .conclusion == "success") | .created_at] | max // ""' <<< "$SWEEPS")"
          SINCE=$((NOW - LOOKBACK_S))
          [ -n "$LAST_OK" ] && SINCE=$(( $(epoch "$LAST_OK") - LOOKBACK_S ))
          # A red that completed before the last run of the retired workflow_run listener was that listener's.
          LISTENER="$(api "actions/workflows/$SELF/runs?event=workflow_run&per_page=1" | jq -r '.workflow_runs[0].created_at // ""')"
          REDS='[]'
          for st in failure startup_failure; do
            got="$(pages "actions/runs?status=$st&created=%3E%3D$(iso $((NOW - 86400)))")"
            REDS="$(printf '%s\n%s' "$REDS" "$got" | jq -cs '.[0] + .[1]')"
          done
          CANDS="$(jq -c --arg watched "$CFA_WATCHED" --arg listener "$LISTENER" --arg since "$(iso "$SINCE")" '
            ($watched | split("\n") | map(select(. != ""))) as $w
            | [.[] | select(.name as $n | $w | index($n)) | select(.updated_at >= $since)
               | select(.event != "pull_request" and .event != "pull_request_target")
               | select(.head_branch != "ci-overflow-ledger")
               | select($listener == "" or .updated_at > $listener)
               | {id, key: "\(.id)#\(.run_attempt // 1)", created_at, updated_at}]
            | unique_by(.key) | sort_by(.created_at)' <<< "$REDS")"
          DONE='[]'
          if [ "$CANDS" != "[]" ]; then
            OLDEST="$(jq -r 'map(.updated_at) | min' <<< "$CANDS")"
            for sid in $(jq -r --argjson me "$GITHUB_RUN_ID" --arg o "$OLDEST" '.[] | select(.id != $me and .created_at >= $o) | .id' <<< "$SWEEPS"); do
              got="$(api "actions/runs/$sid/jobs?per_page=100" | jq -c '[.jobs[] | select(.conclusion == "success") | .name | capture("^notify (?<k>[0-9]+#[0-9]+)$").k]')"
              DONE="$(jq -c --argjson g "$got" '. + $g' <<< "$DONE")"
            done
          fi
          RUNS="$(jq -c --argjson seen "$DONE" '[.[] | select(.key as $k | $seen | index($k) | not) | {id, key}][:20]' <<< "$CANDS")"
          echo "sweep since $(iso "$SINCE"): $(jq length <<< "$CANDS") red run(s) of the watched workflows, $(jq length <<< "$DONE") already notified"
          echo "runs=$RUNS" | tee -a "$GITHUB_OUTPUT"
          echo "default_branch=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO" | jq -er .default_branch)" | tee -a "$GITHUB_OUTPUT"

      # The sweep itself going red pages nobody else: page once, on the green -> red transition.
      - name: Page when the sweep breaks (green -> red only)
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CI_FAIL_WEBHOOK_SECRET: ${{ secrets.CI_FAIL_WEBHOOK_SECRET }}
          WEBHOOK_URL: https://hooks.angventures.io/webhooks/ci-fail
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          PREV="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/workflows/fleet-ci-fail-alert.yml/runs?event=schedule&status=completed&per_page=1" | jq -r '.workflow_runs[0].conclusion // "none"')" || PREV=error
          [ "$PREV" = failure ] && { echo "previous sweep was red too: already paged"; exit 0; }
          body="$(jq -nc --arg repo "$REPO" --arg url "$RUN_URL" --arg sha "$GITHUB_SHA" '{event_type:"ci_failure", card:"", signature:"", repo:$repo, workflow:"Fleet CI-fail alert sweep is red: reds of the watched workflows are not being paged", branch:"main", sha:$sha, run_url:$url, actor:"cron", trigger:"schedule"}')"
          sig="$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$CI_FAIL_WEBHOOK_SECRET" | sed 's/^.* //')"
          curl -fsS -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -H "X-GitHub-Event: ci_failure" \
            -H "X-GitHub-Delivery: ci-fail-sweep-$GITHUB_RUN_ID" -H "X-Webhook-Signature: $sig" --data "$body"

  notify-on-failure:
    needs: sweep
    # Only on a genuine failure of the upstream workflow: the sweep lists failure + startup_failure.
    # startup_failure counts (t_bc0052b9): a run that dies at startup has 0 jobs and no
    # red check, so without this nobody is told, and a re-run that dies this way leaves the
    # PR with no required check at all.
    # A workflow_dispatch replay always starts; the route step re-checks the
    # replayed run's conclusion with the same rule.
    if: ${{ needs.sweep.outputs.runs != '' && needs.sweep.outputs.runs != '[]' }}
    # The leg name is the sweep's dedupe record: keep `notify <run id>#<attempt>`.
    name: notify ${{ matrix.run.key }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.sweep.outputs.runs) }}
    # 2x measured p90 (4 s over 30 runs), floored at 10.
    timeout-minutes: 10
    steps:
      # PAGE GATE (t_957f5398). #alerts is for reds a human acts on:
      #   - head_branch == default branch (push, workflow_dispatch on main, ...)
      #   - event merge_group (the queue ejected a PR on its way to main)
      #   - event schedule
      #   - event release, and a push of a TAG (install-e2e `push: tags`):
      #     head_branch is the tag name, and no PR surfaces these reds
      # Everything else -- a worker's PR / feature / dispatch branch going red --
      # is that worker's feedback and is already visible on the PR: no page.
      # pull_request* events never page, even when a fork's head branch is
      # literally named like the default branch.
      #
      # KNOWN-RED workflows are chronically red, so paging #alerts on every red
      # run is manufactured noise. Their failures go to #logs (the ci-fail-known
      # receiver route). #alerts fires only on a TRANSITION: the previous
      # completed run of the same workflow on the same branch was green, so
      # this red is a real regression. One entry per line, `name|card`. Remove
      # an entry in the PR that makes its card's workflow green again.
      # Unknown names, API errors, and "no previous run" all fail LOUD (#alerts).
      - name: Route (page gate; known-red -> #logs unless green->red transition)
        id: route
        # Bounded and non-fatal (Prism P1 cc0510af974c / 8c9d210ef980): a stalled or failing
        # history lookup must never stop the POST below, which then defaults to #alerts.
        timeout-minutes: 4
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ needs.sweep.outputs.default_branch }}
          # The sweep's red (or the replayed run): fetched below from the API, which returns
          # the same run object schema the workflow_run payload had.
          REPLAY_RUN_ID: ${{ matrix.run.id }}
          RUN_JSON: ""
          KNOWN_RED: |
            Install & Update E2E|t_bab6df79
        run: |
          set -uo pipefail
          if [ -z "${RUN_JSON:-}" ]; then
            RUN_JSON="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs/$REPLAY_RUN_ID")" || {
              echo "::error::cannot fetch run $REPLAY_RUN_ID for replay" >&2; exit 1; }
          fi
          f() { jq -r "$1 // \"\"" <<< "$RUN_JSON"; }
          WF_NAME="$(f .name)"; WF_ID="$(f .workflow_id)"; WF_RUN_ID="$(f .id)"
          WF_BRANCH="$(f .head_branch)"; WF_SHA="$(f .head_sha)"
          WF_CONCLUSION="$(f .conclusion)"; WF_URL="$(f .html_url)"
          WF_ACTOR="$(f .actor.login)"; WF_EVENT="$(f .event)"
          WF_SUBJECT="$(f .head_commit.message | head -n1)"
          {
            echo "wf_name=$WF_NAME"; echo "wf_run_id=$WF_RUN_ID"
            echo "wf_branch=$WF_BRANCH"; echo "wf_sha=$WF_SHA"; echo "wf_url=$WF_URL"
            echo "wf_actor=$WF_ACTOR"; echo "wf_event=$WF_EVENT"
          } >> "$GITHUB_OUTPUT"
          echo "run $WF_RUN_ID '$WF_NAME' event=$WF_EVENT branch=$WF_BRANCH conclusion=$WF_CONCLUSION (default=$DEFAULT_BRANCH)"

          ROUTE=alerts
          case "$WF_CONCLUSION" in
            failure|startup_failure) ;;
            *) ROUTE=none; echo "no page: conclusion $WF_CONCLUSION is not a failure" ;;
          esac
          if [ "$ROUTE" = alerts ]; then
            case "$WF_EVENT" in
              merge_group|schedule|release) ;;
              pull_request|pull_request_target)
                ROUTE=none; echo "no page: $WF_EVENT red is the PR's own feedback" ;;
              *)
                if [ -z "$DEFAULT_BRANCH" ] || [ "$WF_BRANCH" != "$DEFAULT_BRANCH" ]; then
                  # A tag push (install-e2e `push: tags: v*`) reports the TAG as
                  # head_branch. The run payload has no ref, so ask the API whether
                  # refs/tags/<head_branch> resolves to this run's sha. 404/422 =
                  # not a tag (worker branch, stays silent); any other error pages.
                  IS_TAG=0
                  if [ "$WF_EVENT" = push ] && [ -n "$WF_BRANCH" ]; then
                    TAG_BODY="$(mktemp)"
                    TAG_CODE="$(curl -sS -o "$TAG_BODY" -w '%{http_code}' \
                      -H "Authorization: Bearer $GH_TOKEN" \
                      -H "Accept: application/vnd.github+json" \
                      "https://api.github.com/repos/$REPO/commits/refs/tags/$WF_BRANCH")" || TAG_CODE=error
                    case "$TAG_CODE" in
                      200) [ "$(jq -r '.sha // ""' "$TAG_BODY")" = "$WF_SHA" ] && IS_TAG=1 ;;
                      404|422) ;;
                      *) IS_TAG=1; echo "::warning::tag lookup for '$WF_BRANCH' failed ($TAG_CODE); paging" ;;
                    esac
                    rm -f "$TAG_BODY"
                  fi
                  if [ "$IS_TAG" = 1 ]; then
                    echo "page: $WF_EVENT red on tag '$WF_BRANCH'"
                  else
                    ROUTE=none; echo "no page: $WF_EVENT red on non-default branch '$WF_BRANCH'"
                  fi
                fi ;;
            esac
          fi

          CARD=""
          if [ "$ROUTE" = alerts ]; then
            while IFS='|' read -r name card; do
              [ -n "$name" ] && [ "$name" = "$WF_NAME" ] && CARD="$card"
            done <<< "$KNOWN_RED"
          fi
          if [ -n "$CARD" ]; then
            PREV="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" --get \
              --data-urlencode "branch=$WF_BRANCH" --data-urlencode "status=completed" \
              --data-urlencode "per_page=20" \
              "https://api.github.com/repos/$REPO/actions/workflows/$WF_ID/runs" \
              | jq -r --argjson id "$WF_RUN_ID" \
                '[.workflow_runs[] | select(.id < $id)
                  | select(.conclusion == "success" or .conclusion == "failure")]
                  | sort_by(.updated_at) | last | .conclusion // "none"')" \
              || PREV="error"
            echo "known-red '$WF_NAME' ($CARD): previous completed run = $PREV"
            # startup_failure is never demoted: it is a distinct class and always pages.
            if [ "$WF_CONCLUSION" = "failure" ] && [ "$PREV" = "failure" ]; then
              ROUTE=logs
            fi
          fi
          # MERGE-QUEUE DEDUPE (t_70f92e0b). The queue rebuilds a group each time a
          # PR ahead of it is ejected, so ONE broken test re-fails the same PR 3-6
          # times (pr-1332 paged 6x 19:34-20:36Z on 2026-09-27). Page once per
          # (PR, failing-test signature): a red whose signature already failed an
          # earlier merge_group run of the SAME PR in the last 24h stays silent. A
          # new signature, or another PR, still pages. The page names the PR and
          # the failing tests in its first line. Signature = the pytest node ids the
          # test jobs annotate "FAILED (not quarantined)", else the failed job names
          # with the slice number stripped (a test moves between slices as the tree
          # changes). A failed job with no such annotation (lint, a slice that
          # timed out) adds its stripped name, so a new red job alongside an old
          # test failure is a new signature. Any API error keeps the page (fail loud).
          # PR = the gh-readonly-queue/<base>/pr-N-<sha> branch; once the queue ref
          # is deleted the API can return head_branch null, so the squash commit
          # subject's trailing "(#N)" is the durable fallback (both agreed on
          # 100/100 merge_group CI runs, 2026-09-28).
          PR_NUM=""; SIG=""
          if [ "$ROUTE" = alerts ] && [ "$WF_EVENT" = merge_group ]; then
            PR_NUM="$(sed -nE 's#^gh-readonly-queue/.+/pr-([0-9]+)-[0-9a-f]+$#\1#p' <<< "$WF_BRANCH")"
            if [ -z "$WF_BRANCH" ]; then
              PR_NUM="$(sed -nE 's#^.*\(\#([0-9]+)\)$#\1#p' <<< "$WF_SUBJECT")"
            fi
          fi
          # Every GitHub call is bounded and the whole walk has a budget; past it api() fails,
          # which pages (#alerts) with time left in the 10-minute job for the POST. --retry 2: the
          # jobs list of a 90-job run 502s intermittently (2026-10-05, run 37197359967), and the
          # streak walk reads more runs than the old one; a transient 5xx must not page.
          # `timeout` hard-caps each call (75 s): --max-time bounds one attempt, not curl's sleep before a
          # retry, which an old curl takes from Retry-After (Prism P1 d27c81521ab7).
          ROUTE_DEADLINE=$((SECONDS + ${ROUTE_BUDGET_S:-150}))
          api() { [ "$SECONDS" -lt "$ROUTE_DEADLINE" ] || return 1; timeout "${API_CALL_S:-75}" curl -fsS --retry 2 --retry-max-time 40 --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/$1"; }
          run_jobs() {  # run id -> {"jobs": [every job]}, following pages; rc!=0 on an API error or an incomplete list
            [ -n "${JOBS_CACHE:-}" ] && [ -s "$JOBS_CACHE/$1" ] && { cat "$JOBS_CACHE/$1"; return 0; }
            # A run can carry > 100 jobs. One page would drop a failed job (missed page) or a job
            # that passed (main looks still red): Prism P1 30c28a402d93 / 8adcbc19fb8b, 2026-10-04.
            local page=1 resp total acc='[]'
            while :; do
              resp="$(api "actions/runs/$1/jobs?filter=latest&per_page=100&page=$page")" || return 1
              total="$(jq -er '.total_count | numbers' <<< "$resp")" || return 1
              # Accumulator on stdin, not argv: one 100-job page is ~240 KB, over Linux's 128 KiB
              # per-argument limit (Prism P2, run 37243401496 measured 244 KB).
              acc="$(printf '%s\n%s' "$acc" "$resp" | jq -cs '.[0] + .[1].jobs')" || return 1
              [ "$(jq length <<< "$acc")" -ge "$total" ] && break
              # A short page before total_count, or more than 1000 jobs: incomplete, so fail (page).
              { [ "$(jq '.jobs | length' <<< "$resp")" -gt 0 ] && [ "$page" -lt 10 ]; } || return 1
              page=$((page + 1))
            done
            acc="$(jq -c '{jobs: .}' <<< "$acc")" || return 1
            [ -n "${JOBS_CACHE:-}" ] && printf '%s\n' "$acc" > "$JOBS_CACHE/$1"
            printf '%s\n' "$acc"
          }
          BACKSTOP_S="${BACKSTOP_S:-3600}"   # = BACKSTOP_S in hermes-home scripts/main-red-summary.py
          JOBS_CACHE="$(mktemp -d)"           # the streak walk reads each run's jobs more than once
          meta() {  # run id, field -> that field of the run in main's run listing (RUNS_RAW); "" if absent
            jq -r --argjson id "$1" --arg f "$2" '[.workflow_runs[] | select(.id == $id) | .[$f] // ""][0] // ""' <<< "$RUNS_RAW"
          }
          # The aggregate jobs (Tests complete, All required checks pass) fail whenever another
          # job fails. A gate step there ("Fail on skipped or failed ...", "Evaluate job results")
          # is derivative, and dropped, only when one of ITS prerequisite jobs failed or timed
          # out; a gate that failed on a skipped/missing job is a new fault and
          # stays an item (Prism P1 891d36986f43). Any OTHER failed step (Tests complete runs the
          # quarantine lint + evidence gate) is independent and stays an item (Prism P1 "Retain
          # independent failures inside Tests complete", 6117082a). An aggregate job that timed
          # out with no independent failed step is a stepless item (Prism P1 b0cbda43048e).
          # Use: `. as $r | .jobs[] | ... agg_items($r.jobs)`; each item is [job, step].
          # norm: a test slice is not a job identity (slices are re-cut from durations, so a test moves
          # between them); every "Run tests slice N/M" is ONE item, as in sig_of (t_54478fb0).
          AGG_JQ='def bad: . == "failure" or . == "timed_out";
            def norm: sub(" slice [0-9]+/[0-9]+$"; "");
            def aggregate: .name | test("Tests complete|All required checks");
            def derivative($all; $s): (.name | sub("Tests complete$"; "")) as $p
              # only failed/timed_out prerequisites, which are items themselves; a cancelled one
              # is not an item, so its gate step stays one (Prism P1 8a4efca8c2ad)
              | [$all[] | select(.conclusion | bad) | .name] as $down
              | if $s == "Fail on skipped or failed e2e-upgrade shards" then any($down[]; startswith($p + "e2e-upgrade"))
                elif $s == "Fail on skipped or failed required tests" then
                  any($down[]; . == $p + "Generate slices" or startswith($p + "Run tests ") or . == $p + "e2e")
                elif $s == "Evaluate job results" then any($down[]; test("All required checks") | not)
                else false end;
            def agg_items($all): . as $a
              | [.steps[]? | select(.conclusion | bad) | .name | select(. as $s | $a | derivative($all; $s) | not)
                | [$a.name, .]]
              | if length == 0 and $a.conclusion == "timed_out" then [[$a.name, ""]] else . end;'
          sig_of() {  # run id [nodes] -> signature on stdout ("nodes": one full pytest node id per line); rc!=0 on any API error
            local jobs failed id name ann got items="" nodes=""
            jobs="$(run_jobs "$1")" || return 1
            failed="$(jq -r "$AGG_JQ"'
              . as $r | .jobs[] | select(.conclusion | bad)
              | if aggregate then (agg_items($r.jobs)[] | "-\t" + (if .[1] == "" then .[0] else "\(.[0]) / \(.[1])" end))
                else "\(.id)\t\(.name)" end' <<< "$jobs")" || return 1
            while IFS=$'\t' read -r id name; do
              [ -n "$id" ] || continue
              [ -n "${3:-}" ] && [ "$(sed -E 's# slice [0-9]+/[0-9]+$##' <<< "$name")" != "$3" ] && continue
              if [ "$id" = - ]; then items+="$name"$'\n'; continue; fi
              got="$(api "check-runs/$id/annotations?per_page=100" < /dev/null)" || return 1
              ann="$(jq -r '.[].message | select(test(": FAILED \\(not quarantined\\)$")) | sub(": FAILED \\(not quarantined\\)$"; "")' <<< "$got")" || return 1
              if [ -n "$ann" ]; then
                nodes+="$ann"$'\n'
                items+="$ann"$'\n'
              elif ! grep -qE 'Tests complete|All required checks' <<< "$name"; then
                items+="$(sed -E 's# slice [0-9]+/[0-9]+$##' <<< "$name")"$'\n'
              fi
            done <<< "$failed"
            if [ "${2:-}" = nodes ]; then grep -v '^$' <<< "$nodes" | sort -u || true; return 0; fi
            printf '%s' "$(grep -v '^$' <<< "$items" | sort -u | paste -sd ';' - | sed 's/;/; /g')"
          }
          if [ -n "$PR_NUM" ]; then
            if SIG="$(sig_of "$WF_RUN_ID")" && [ -n "$SIG" ]; then
              SINCE="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-24H +%Y-%m-%dT%H:%M:%SZ)"
              PRIOR="$(api "actions/workflows/$WF_ID/runs?event=merge_group&status=failure&per_page=50" \
                | jq -r --argjson id "$WF_RUN_ID" --arg pr "$PR_NUM" --arg since "$SINCE" \
                  '[.workflow_runs[] | select(.id < $id and .created_at >= $since)
                    | select(if (.head_branch // "") != ""
                        then .head_branch | test("^gh-readonly-queue/.+/pr-" + $pr + "-[0-9a-f]+$")
                        else ((.head_commit.message // "") + "\n") | split("\n")[0] | test("\\(#" + $pr + "\\)$") end)
                    | .id][:5][]')" || PRIOR=error
              if [ "$PRIOR" = error ]; then
                echo "::warning::prior merge_group run lookup failed; paging"
              else
                for prev in $PRIOR; do
                  if [ "$(sig_of "$prev" || echo __error__)" = "$SIG" ]; then
                    ROUTE=none; echo "no page: PR #$PR_NUM already failed the queue on '$SIG' (run $prev)"; break
                  fi
                done
              fi
            else
              SIG=""; echo "::warning::cannot read the failing tests of run $WF_RUN_ID; paging"
            fi
          fi
          # ALREADY-RED FOLD (t_be1b9134). One broken test on trunk ejects EVERY PR
          # the queue tries (2026-09-28: 2 tests, 6 PRs, 9 ejection pages + 5 main
          # pages in 3h). The per-PR dedupe above cannot see that: each PR is new.
          # A merge_group red whose failing tests (pytest node
          # ids only) ALL already failed, in the last 12h, a default-branch push run
          # or ANOTHER PR's merge_group run of this workflow is the same fault: it
          # goes to #logs (ci-fail-known route, which falls back to #alerts if that
          # POST fails). The first red of each test still pages, and main-red-watch
          # owns the main episode + fix card. SIG items are "; "-separated; ANY
          # item that is not a pytest node id (a failed job with no FAILED
          # annotation: lint, Windows-only, a segfaulted slice) blocks the fold, so
          # a new red job next to an old test still pages. A new test, or any API
          # error -> no fold (page). A queue run whose ref was deleted
          # (head_branch null) is matched to its PR by the squash subject "(#N)".
          FOLD_RUN=""
          # A default-branch push red is the MAIN-RED STREAK's below (t_54478fb0): folding it here
          # would route the 2nd consecutive red of a test (the one that must page) to #logs.
          if [ "$ROUTE" = alerts ] && [ -n "$WF_ID" ] && [ -n "$PR_NUM" ]; then
            items_of() { sed 's/; /\n/g' <<< "$1" | grep -v '^$' | sort -u; }
            if [ -n "$SIG" ] && ! items_of "$SIG" | grep -qv '::'; then
              SINCE12="$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-12H +%Y-%m-%dT%H:%M:%SZ)"
              CANDS="$(api "actions/workflows/$WF_ID/runs?status=failure&per_page=50" \
                | jq -r --argjson id "$WF_RUN_ID" --arg since "$SINCE12" --arg def "$DEFAULT_BRANCH" --arg pr "$PR_NUM" \
                  '[.workflow_runs[] | select(.id < $id and .created_at >= $since)
                    | (if (.head_branch // "") != ""
                        then ((.head_branch | capture("^gh-readonly-queue/.+/pr-(?<n>[0-9]+)-[0-9a-f]+$") | .n) // "")
                        else ((((.head_commit.message // "") + "\n") | split("\n")[0] | capture("\\(#(?<n>[0-9]+)\\)$") | .n) // "") end) as $qpr
                    | select((.event == "push" and .head_branch == $def)
                        or (.event == "merge_group" and $qpr != "" and $qpr != $pr))
                    | .id][:8][]')" || CANDS=error
              if [ "$CANDS" = error ]; then
                echo "::warning::already-red fold: run lookup failed; paging"
              else
                LEFT="$(items_of "$SIG")"
                for prev in $CANDS; do
                  PSIG="$(sig_of "$prev")" || { LEFT="__error__"; echo "::warning::already-red fold: cannot read run $prev; paging"; break; }
                  NEXT="$(comm -23 <(printf '%s\n' "$LEFT") <(items_of "$PSIG") | grep -v '^$' || true)"
                  [ "$NEXT" != "$LEFT" ] && FOLD_RUN="${FOLD_RUN:+$FOLD_RUN,}$prev"   # name only runs that covered a test
                  LEFT="$NEXT"
                  [ -z "$LEFT" ] && break
                done
                if [ -z "$LEFT" ]; then
                  ROUTE=logs; CARD="already-red (run ${FOLD_RUN})"
                  echo "fold: '$SIG' already failed run(s) $FOLD_RUN in the last 12h -> #logs"
                else
                  FOLD_RUN=""
                fi
              fi
            fi
          fi
          # MAIN-RED STREAK (t_54478fb0, Apollo ruling B; was MAIN STILL RED, t_30d3de38).
          # A red default-branch push pages #alerts only on the SECOND consecutive red of
          # an item (failed job / step; test slices are one item, and a slice item is the
          # same fault only when the same pytest node ids failed): walking back through the
          # previous completed push runs of this workflow on the default branch (newest
          # first), the item's latest execution was red and the one before it was not. A
          # job or step that did not run proves nothing, so the walk goes past it. Order is
          # commit order (created_at), not completion order. To #logs (ci-fail-known, which
          # falls back to #alerts if that POST fails): a first red (10-04/05: 3 one-run
          # slice reds paged and cleared on the next run), a 3rd+ red (10-04: e2e-upgrade
          # paged 6 times in 4 h for one red main), and a 2nd red whose run was created
          # >= BACKSTOP_S after the first red's run (hermes-home
          # scripts/main-red-summary.py's persistence backstop pages that one, and a red
          # that is never re-run). startup_failure and any API error page. main-red-summary
          # pages none of the reds this workflow watches except as that backstop.
          STILL_SIG=""; STREAK_SUMMARY=""
          WF_CREATED="$(f .created_at)"
          if [ "$ROUTE" = alerts ] && [ "$WF_EVENT" = push ] && [ "$WF_CONCLUSION" = failure ] \
             && [ -n "$WF_ID" ] && [ -n "$DEFAULT_BRANCH" ] && [ "$WF_BRANCH" = "$DEFAULT_BRANCH" ]; then
            # Items = [job, step] of each failed step ([job, ""] if no step failed, e.g. a job
            # timeout). timed_out counts as failed (Prism P1 f-ac6b7f1a201ac052). A failed job
            # whose name is not unique in the run cannot be matched by name, so the jq errors
            # and the red pages (Prism P1 f-96b4792f11201e3e).
            # A failed step whose name repeats in its job cannot be matched by name either: the jq
            # errors and the red pages (Prism P1 "Ambiguous steps", 6117082a). An aggregate job
            # adds only its independent failed steps (AGG_JQ agg_items).
            ITEMS="$(run_jobs "$WF_RUN_ID" | jq -c "$AGG_JQ"'
              . as $r | (.jobs | group_by(.name) | map(select(length > 1) | .[0].name)) as $dup
              | [.jobs[] | select(.conclusion | bad)
                | if (.name | IN($dup[])) then error("ambiguous job name: \(.name)") else . end
                | . as $j | [.steps[]?.name] as $names
                | if aggregate then agg_items($r.jobs)[]
                  else ([.steps[]? | select(.conclusion | bad) | [($j.name | norm), .name]]
                    | if length == 0 then [[($j.name | norm), ""]] else . end)[] end
                | . as [$jn, $sn] | if $sn != "" and ([$names[] | select(. == $sn)] | length) > 1
                  then error("ambiguous step name: \($jn) / \($sn)") else . end] | unique')" || ITEMS=error
            BR_Q="$(jq -rn --arg b "$DEFAULT_BRANCH" '$b | @uri')"
            RUNS_RAW="$(api "actions/workflows/$WF_ID/runs?branch=$BR_Q&event=push&status=completed&per_page=50${WF_CREATED:+&created=%3C%3D$WF_CREATED}")" || RUNS_RAW=""
            PREVS="$([ -n "$RUNS_RAW" ] || exit 1; jq -r --argjson id "$WF_RUN_ID" --arg created "$WF_CREATED" '
                # created_at has 1 s precision: another run created in the same second cannot be
                # ordered against this one, so page instead of dropping it (Prism P1 569d6f572e69).
                if $created != "" and any(.workflow_runs[]; .id != $id and .created_at == $created)
                then error("a main run shares created_at \($created)") else . end
                | [.workflow_runs[] | select(.id != $id)
                  | select($created == "" or .created_at < $created)]
                # two earlier runs created in the same second cannot be ordered either: an older
                # red could be walked before a newer green (Prism P1 d12fe5a4bf6d)
                | if (group_by(.created_at) | any(length > 1)) then error("two main runs share a created_at") else . end
                | sort_by(.created_at) | reverse | .[:20][] | .id' <<< "$RUNS_RAW")" || PREVS=error
            # the pytest node ids this run failed (same_tests below)
            NODES="$(sig_of "$WF_RUN_ID" nodes)" || ITEMS=error
            if [ "$ITEMS" = error ] || [ "$PREVS" = error ] || [ "$ITEMS" = "[]" ]; then
              echo "::warning::main-still-red: cannot read this run's failed jobs or main's history; paging"
            else
              # Per item in a prior run, over every job with the item's slice-stripped name:
              # red (the step failed in one), green (it passed in all), differs (failed for a
              # different reason), unknown (did not run, or did not finish everywhere: look
              # further back), ambiguous (a job or step name repeats: cannot be matched).
              # Was this red streak already NOTICED (an earlier notifier routed it as its 2nd red:
              # paged it, or left it to the backstop as LATE below)? Replays every notifier of the
              # streak over what it could see: a run Y notifies only if it concluded failure (a
              # cancelled run never notifies), and it saw only runs created before it that had
              # completed by the time it finished (overlapping runs and later re-runs of an older
              # commit are not seen; Prism P1 31122e0a54bf / 358db3d855b2 / 805a46df2012). Y left the
              # streak to the backstop when Y was created >= BACKSTOP_S after the latest red it saw
              # (Prism P1 f9a5572f1892): this red is then LATE too, never a fresh page. A slice item
              # links two reds only when every test the newer one failed also failed in the older
              # (Prism P1 21a041362289). Asking only "did R's notifier pair R with the run before it"
              # paged one streak twice on hermes-home (2026-10-10 08:42 + 09:01Z, ace-media-preflight):
              # R finished before its predecessor, yet an earlier notifier had paged the streak
              # (ANG-Ventures/hermes-home#3529, t_6c8d8622, t_e4208718).
              # stdin: RUNS_RAW. $st: [{id, st, nodes}] newest first, from R back. $bs: BACKSTOP_S.
              # -> "old" (paged before) | "late" (left to the backstop) | "second" (never noticed).
              # shellcheck disable=SC2016 # a jq program, not shell
              STREAK_JQ='
                (.workflow_runs | map({key: (.id | tostring), value: .}) | from_entries) as $m
                | [$st[] | ($m[.id | tostring] // {}) as $r
                   | . + {created: ($r.created_at // ""), updated: ($r.updated_at // ""), concl: ($r.conclusion // "")}] as $all
                | def same($n; $o): ($n.nodes - $o.nodes) == [];
                  def epoch: if . == "" then null else fromdateiso8601 end;
                  # the item'"'"'s red streak in one notifier'"'"'s view, null (a first red), or "?" when a
                  # job/step name that repeats decides it. Only an entry a view CONSUMES can be "?": an
                  # ambiguous run behind the green that ends the streak decides nothing (Prism P1 814ce172a760).
                  def streak($self; $v):
                    ([range(0; ([$v | length, 10] | min)) | select($v[.].st != "unknown")] | first) as $k
                    | if $k == null then null
                      elif $v[$k].st == "ambiguous" then "?"
                      elif $v[$k].st != "red" or (same($self; $v[$k]) | not) then null
                      else reduce $v[$k:$k + 11][] as $r ({out: [], done: false};
                        if .done then .
                        elif $r.st == "ambiguous" then .done = true | .out = "?"
                        elif $r.st == "red" and (.out == [] or same(.out[-1]; $r)) then .out += [$r]
                        elif $r.st == "unknown" then . else .done = true end) | .out end;
                  # how a streak was covered by the runs in it: "page" > "late" > "?" (cannot tell) > false
                  def covered($memo; $s): [$s[] | $memo[.id | tostring] // false] as $c
                    | if any($c[]; . == "page") then "page" elif any($c[]; . == "late") then "late"
                      elif any($c[]; . == "?") then "?" else false end;
                # $memo[y] = how the streak was COVERED once y finished: inherited from a covered red of
                # its streak, else y'"'"'s own notifier routed it as the 2nd red (page / late). Coverage, not
                # "y paged", so a streak longer than the 11-run window keeps it (Prism P2 7a67c2ae780e;
                # hermes-home#3529 dd7a7696e7).
                (reduce ($all | sort_by(.created))[] as $y ({};
                   . as $memo
                   | streak($y; $all | map(select(.created < $y.created and .updated <= $y.updated))) as $s
                   | .[$y.id | tostring] = (
                       if $y.st != "red" or $s == null then false
                       elif $s == "?" then "?"
                       else covered($memo; $s) as $in
                         | if $in != false then $in
                           elif $y.concl == "failure" then (($y.created | epoch) as $a | ($s[0].created | epoch) as $b
                             | if $a != null and $b != null and $a - $b >= $bs then "late" else "page" end)
                           else false end end))) as $memo
                # this run vs R was already compared (tests included) by the walk above
                | streak({nodes: []}; $all) as $cur
                | (if $cur == "?" then "?" else covered($memo; $cur // []) end) as $by
                | if $by == "page" then "old" elif $by == "late" then "late"
                  elif $by == "?" then error("an ambiguous job or step name decides the streak") else "second" end'
              classify() {  # run id, items JSON -> one state per item; rc!=0 on an API error
                run_jobs "$1" | jq -c --argjson items "$2" "$AGG_JQ"'
                  . as $r | [$items[] as [$j, $s]
                    | [$r.jobs[] | select(.name | norm == $j)] as $same
                    | if ($same | group_by(.name) | any(length > 1)) then "ambiguous"
                      elif $same == [] then "unknown"
                      elif $s == "" then
                        (if all($same[]; .conclusion == "success") then "green"
                         elif any($same[]; .conclusion | bad) | not then "unknown"
                         elif any($same[]; (.conclusion | bad) and ([.steps[]? | select(.conclusion | bad)] == [])) then "red"
                         else "differs" end)
                      else [$same[] | . as $job | [.steps[]? | select(.name == $s)]
                             | if length > 1 then "ambiguous" elif length == 0 then "none"
                               elif (.[0].conclusion // "" | bad) and ($job | aggregate) and ($job | derivative($r.jobs; $s)) then "differs"
                               elif (.[0].conclusion // "" | bad) then "red"
                               elif .[0].conclusion == "success" then "green" else "none" end] as $st
                        | if any($st[]; . == "ambiguous") then "ambiguous"
                          elif any($st[]; . == "red") then "red"
                          elif any($st[]; . == "differs") then "differs"
                          elif $st != [] and all($st[]; . == "green") then "green" else "unknown" end
                      end]'
              }
              # A slice item cannot tell two tests apart: a red of it is the SAME fault only when
              # every pytest node id this run failed also failed there (Prism P1 5515ab6c4f85;
              # ids compared whole, one per line: Prism P1 702860bc5678). Else: a different fault.
              # scoped to ONE item (Prism P1 11312fe7c5f9): another job's new test must not reset it
              same_tests() {  # run id, item job [, base run] -> rc 0 base's tests all failed in run too, 1 not, 2 API error
                local c p
                c="$(sig_of "${3:-$WF_RUN_ID}" nodes "$2")" || return 2
                [ -z "$c" ] && return 0
                p="$(sig_of "$1" nodes "$2")" || return 2
                [ -z "$(comm -23 <(printf '%s\n' "$c") <(printf '%s\n' "$p") | grep -v '^$' || true)" ] || return 1
              }
              # Node ids describe the TEST step only: another step of a slice job (an upload, a checkout)
              # fails for its own reason, so a repeat of it is the same fault whatever the tests did
              # (Prism P1 1bc892158064). Test step = "Run tests ..." / "Slice verdict ...", or stepless.
              TEST_ITEM_JQ='(.[0] | test("Run tests")) and (.[1] == "" or (.[1] | test("^(Run tests|Slice verdict)")))'
              tests_item() { jq -e "$TEST_ITEM_JQ" <<< "$1" > /dev/null; }
              # STREAK (t_54478fb0, Apollo ruling B). Page only the SECOND consecutive red of an
              # item (job / step): its latest earlier execution on main was red (run R) and the
              # execution before R was not. A first red (a one-run flake until it repeats) and a
              # 3rd+ red (the 2nd already paged) go to #logs. A 2nd red whose run was CREATED
              # >= BACKSTOP_S after run R also goes to #logs: hermes-home
              # scripts/main-red-summary.py's persistence backstop pages that one (it compares the
              # same two run created_at values, so exactly one of the two pages). The walk looks
              # 10 runs back from this run and 10 more back from R. Any API error or ambiguous
              # name pages.
              LEFT="$ITEMS"; COVER=""; REDAT='[]'; NEWS='[]'; BAD=""; w=0
              for prev in $PREVS; do
                [ "$w" -lt 10 ] || break; w=$((w + 1))
                # Per item in a prior run: red (that step failed), green (it ran and passed),
                # differs (failed for a different reason: a new fault), unknown (did not run,
                # e.g. path-classified CI skipped it; look further back), ambiguous (a job or
                # step name that is not unique cannot be matched: page).
                ST="$(classify "$prev" "$LEFT")" || { BAD="cannot read run $prev"; break; }
                if jq -e 'index("ambiguous")' <<< "$ST" > /dev/null; then
                  BAD="a failed job or step name is not unique in run $prev"; break
                fi
                HIT="$(jq -c --argjson st "$ST" '[to_entries[] | select($st[.key] == "red") | .value]' <<< "$LEFT")"
                if [ -n "$NODES" ]; then
                  for TJ in $(jq -r ".[] | select($TEST_ITEM_JQ) | .[0] | @base64" <<< "$HIT" | sort -u); do
                    TJ="$(base64 -d <<< "$TJ")"
                    if same_tests "$prev" "$TJ"; then rc=0; else rc=$?; fi
                    [ "$rc" = 2 ] && { BAD="cannot read the tests of run $prev"; break 2; }
                    if [ "$rc" = 1 ]; then
                      echo "different tests failed in run $prev: $TJ is a new fault"
                      ST="$(jq -c --argjson l "$LEFT" --arg j "$TJ" "[to_entries[] | if .value == \"red\" and \$l[.key][0] == \$j and (\$l[.key] | $TEST_ITEM_JQ) then \"differs\" else .value end]" <<< "$ST")"
                    fi
                  done
                  HIT="$(jq -c --argjson st "$ST" '[to_entries[] | select($st[.key] == "red") | .value]' <<< "$LEFT")"
                fi
                NEWS="$(jq -c --argjson st "$ST" --argjson n "$NEWS" '$n + [to_entries[] | select($st[.key] == "green" or $st[.key] == "differs") | .value]' <<< "$LEFT")"
                if [ "$HIT" != "[]" ]; then
                  COVER="${COVER:+$COVER,}$prev"
                  REDAT="$(jq -c --argjson h "$HIT" --arg r "$prev" '. + [$h[] | {item: ., run: $r}]' <<< "$REDAT")"
                fi
                LEFT="$(jq -c --argjson st "$ST" '[to_entries[] | select($st[.key] == "unknown") | .value]' <<< "$LEFT")"
                [ "$LEFT" = "[]" ] && break
              done
              # no execution in the last 10 main runs: a first red as far as this walk can see
              [ -z "$BAD" ] && NEWS="$(jq -c --argjson l "$LEFT" '. + $l' <<< "$NEWS")"
              PAGE='[]'; LATE='[]'; OLD='[]'; PAGE_RUNS=""
              n="$(jq length <<< "$REDAT")"; k=0
              while [ -z "$BAD" ] && [ "$k" -lt "$n" ]; do
                IT="$(jq -c ".[$k].item" <<< "$REDAT")"; R="$(jq -r ".[$k].run" <<< "$REDAT")"; k=$((k + 1))
                STS='[]'; past=0; TJ=""
                tests_item "$IT" && TJ="$(jq -r '.[0]' <<< "$IT")"
                for z in $PREVS; do
                  [ "$past" = 1 ] || [ "$z" = "$R" ] || continue; past=1
                  # an ambiguous run is recorded, not fatal: STREAK_JQ fails only if a view consumes it
                  S1="$(classify "$z" "[$IT]" | jq -r '.[0]')" || { BAD="cannot read run $z"; break; }
                  ZN='[]'
                  if [ -n "$TJ" ] && [ "$S1" = red ]; then
                    ZN="$(sig_of "$z" nodes "$TJ" | jq -Rsc 'split("\n") | map(select(. != ""))')" \
                      || { BAD="cannot read the tests of run $z"; break; }
                  fi
                  STS="$(jq -c --argjson id "$z" --arg st "$S1" --argjson n "$ZN" '. + [{id: $id, st: $st, nodes: $n}]' <<< "$STS")"
                done
                [ -n "$BAD" ] && break
                KIND="$(jq -r --argjson st "$STS" --argjson bs "$BACKSTOP_S" "$STREAK_JQ" <<< "$RUNS_RAW")" \
                  || { BAD="cannot replay the streak of $IT"; break; }
                if [ "$KIND" = old ]; then
                  OLD="$(jq -c --argjson i "$IT" '. + [$i]' <<< "$OLD")"; continue
                fi
                if [ "$KIND" = late ]; then
                  LATE="$(jq -c --argjson i "$IT" '. + [$i]' <<< "$LATE")"; continue
                fi
                # the window is between the two RUNS (created_at), so every item of one run pair gets
                # the same answer here and in main-red-summary.py: one fault never pages from both
                T1="$(jq -rn --arg c "$WF_CREATED" '$c | fromdateiso8601')" || T1=""
                T0="$(jq -rn --arg c "$(meta "$R" created_at)" '$c | fromdateiso8601')" || T0=""
                if [ -n "$T1" ] && [ -n "$T0" ] && [ $((T1 - T0)) -ge "$BACKSTOP_S" ]; then
                  LATE="$(jq -c --argjson i "$IT" '. + [$i]' <<< "$LATE")"
                else
                  PAGE="$(jq -c --argjson i "$IT" '. + [$i]' <<< "$PAGE")"; PAGE_RUNS="${PAGE_RUNS:+$PAGE_RUNS,}$R"
                fi
              done
              sig() { jq -r 'map(if .[1] == "" then .[0] else "\(.[0]) / \(.[1])" end) | join("; ")' <<< "$1"; }
              STILL_SIG="$(sig "$ITEMS")"
              if [ -n "$BAD" ]; then
                echo "::warning::main-red streak: $BAD; paging"
              elif [ "$PAGE" != "[]" ]; then
                STREAK_SUMMARY="red on 2 consecutive main runs (also run $(tr ',' '\n' <<< "$PAGE_RUNS" | sort -u | paste -sd, -)): $(sig "$PAGE")"
                echo "page: $STREAK_SUMMARY"
              elif [ "$OLD" != "[]" ]; then
                ROUTE=logs; CARD="main-still-red (run $COVER)"
                STREAK_SUMMARY="main still red on the same failure as run(s) $COVER: $STILL_SIG"
                echo "main-still-red: run(s) $COVER already failed '$STILL_SIG' -> #logs"
              elif [ "$LATE" != "[]" ]; then
                ROUTE=logs; CARD="main-red-backstop (run $COVER)"
                STREAK_SUMMARY="red again >= $((BACKSTOP_S / 60)) min after run $COVER; main-red-summary's backstop pages a persistent red: $(sig "$LATE")"
                echo "late 2nd red -> #logs (the backstop's): $(sig "$LATE")"
              else
                ROUTE=logs; CARD="first-red"
                STREAK_SUMMARY="first red on main; a 2nd consecutive red pages: $(sig "$NEWS")"
                echo "first red -> #logs: $(sig "$NEWS")"
              fi
            fi
          fi
          # MERGED-ANYWAY (t_4e93bc97). A stacked queue merges PR A together with a
          # later group B that contains it, so A can land while A's own group run
          # is red (hermes-agent#1652, 2026-10-03: run 37099128739 red on a uv
          # install timeout, #1658's group 37099129489 green, both merged
          # 05:21:44Z, and the page "PR #1652 ejected" went out at 05:22:17).
          # A red whose PR is already merged ejected nothing: it goes to #logs.
          # Any API error keeps the page (fail loud).
          if [ "$ROUTE" = alerts ] && [ -n "$PR_NUM" ]; then
            MERGED="$(api "pulls/$PR_NUM" | jq -r '.merged // false')" || MERGED=error
            if [ "$MERGED" = true ]; then
              ROUTE=logs; CARD="merged-anyway"; echo "no page: PR #$PR_NUM already merged; nothing was ejected -> #logs"
            elif [ "$MERGED" = error ]; then
              echo "::warning::merged lookup for PR #$PR_NUM failed; paging"
            fi
          fi
          # QUEUE EJECTION -> #logs (t_02841e61). A red merge_group run is a PR the queue dropped,
          # and the queue heals it: all 15 ejection pages on 2026-10-05 (10 PRs) were for PRs that
          # merged on a later queue run (the lander / mq-eviction-watch re-enqueue them), and 5 of
          # the 15 were runs whose jobs never got a runner (cancelled, 0 steps). The act-now cases page from
          # their own monitors: one test ejecting >=2 batches or queue thrash (mq-ejection-watch, one
          # mq-episode), a PR still not merged after the horizon (fleet-merge-horizon-watch), trunk red
          # (the main-red streak below / main-red-summary). So a per-PR ejection is a #logs line
          # (ci-fail-known, which falls back to #alerts if that POST fails). startup_failure still
          # pages: the workflow could not start, so no queue run will ever pass.
          if [ "$ROUTE" = alerts ] && [ "$WF_EVENT" = merge_group ] && [ "$WF_CONCLUSION" = failure ]; then
            ROUTE=logs; CARD="mq-ejected"
            echo "queue ejection -> #logs: mq-ejection-watch / fleet-merge-horizon-watch page a queue fault"
          fi
          # PLACEMENT PROBE (t_c58e7200). ci-placement-probe.yml is dispatched by
          # p4_bench.py inside a bench window, and each wave is graded by
          # p4_gates.py; the nightly bench cron pages #alerts + files a card on a
          # red wave. The window file is local to the controller host, so GitHub
          # cannot see it. The proxy is the dispatcher: every bench wave is
          # dispatched with an ang-fleet-workers[bot] token (all 310 bot-dispatched
          # probe runs were bench waves, measured 2026-09-28), so a bot red is silent.
          # A red dispatched by anyone else (a hand `gh workflow run`) pages ONCE
          # per wave: a later red of the same wave in the last 24h is silent.
          # Only a prior red THIS route paged counts (FleetReview #1482): a
          # bot-dispatched or non-default-branch red of the wave was silent, so
          # it must not suppress the first hand-dispatched red on the default branch.
          # Any API error keeps the page (fail loud).
          if [ "$ROUTE" = alerts ] && [ "$WF_NAME" = "CI placement probe" ]; then
            WF_TITLE="$(f .display_title)"
            WAVE="$(sed -nE 's/^placement probe (.+) #[^ #]+$/\1/p' <<< "$WF_TITLE")"
            if [ "$WF_ACTOR" = "ang-fleet-workers[bot]" ]; then
              ROUTE=none; echo "no page: bench-dispatched probe run; the bench grades and pages its wave"
            elif [ -n "$WAVE" ]; then
              SINCE="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-24H +%Y-%m-%dT%H:%M:%SZ)"
              BR_Q="$(jq -rn --arg b "$DEFAULT_BRANCH" '$b | @uri')"
              PRIOR="$(api "actions/workflows/$WF_ID/runs?event=workflow_dispatch&status=failure&branch=$BR_Q&per_page=100" \
                | jq -r --argjson id "$WF_RUN_ID" --arg p "placement probe $WAVE #" --arg since "$SINCE" \
                    --arg br "$DEFAULT_BRANCH" --arg bot "ang-fleet-workers[bot]" \
                  '[.workflow_runs[] | select(.id < $id and .created_at >= $since)
                    | select((.head_branch // "") == $br)
                    | select((.actor.login // "") != "" and .actor.login != $bot)
                    | select((.display_title // "") | startswith($p)) | .id][0] // ""')" || PRIOR=error
              if [ "$PRIOR" = error ]; then
                echo "::warning::prior probe run lookup failed; paging"
              elif [ -n "$PRIOR" ]; then
                ROUTE=none; echo "no page: probe wave '$WAVE' already paged (run $PRIOR)"
              fi
            fi
          fi
          SUMMARY=""
          if [ -n "$PR_NUM" ]; then
            SUMMARY="PR #$PR_NUM ejected from the merge queue: ${SIG:-failing job unknown}"
            [ -n "$FOLD_RUN" ] && SUMMARY="PR #$PR_NUM ejected on an already-red test (also failed run $FOLD_RUN): $SIG"
            [ "$CARD" = merged-anyway ] && SUMMARY="PR #$PR_NUM merged anyway; its own queue run was red: ${SIG:-failing job unknown}"
            [ "${#SUMMARY}" -gt 400 ] && SUMMARY="${SUMMARY:0:400}..."
          elif [ -n "$FOLD_RUN" ]; then
            SUMMARY="main red on an already-red test (also failed run $FOLD_RUN): $SIG"
            [ "${#SUMMARY}" -gt 400 ] && SUMMARY="${SUMMARY:0:400}..."
          elif [ -n "$STREAK_SUMMARY" ]; then
            SUMMARY="$STREAK_SUMMARY"
            [ "${#SUMMARY}" -gt 400 ] && SUMMARY="${SUMMARY:0:400}..."
          fi
          echo "pr=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "summary=$SUMMARY" | tee -a "$GITHUB_OUTPUT"
          echo "route=$ROUTE" | tee -a "$GITHUB_OUTPUT"
          echo "card=$CARD" >> "$GITHUB_OUTPUT"

      - name: Sign and POST CI-failure event
        if: ${{ steps.route.outputs.route != 'none' }}
        env:
          ROUTE: ${{ steps.route.outputs.route }}
          CARD: ${{ steps.route.outputs.card }}
          PR_NUM: ${{ steps.route.outputs.pr }}
          SUMMARY: ${{ steps.route.outputs.summary }}
          CI_FAIL_WEBHOOK_SECRET: ${{ secrets.CI_FAIL_WEBHOOK_SECRET }}
          WEBHOOK_URL: https://hooks.angventures.io/webhooks/ci-fail
          WF_NAME: ${{ steps.route.outputs.wf_name }}
          WF_BRANCH: ${{ steps.route.outputs.wf_branch }}
          WF_SHA: ${{ steps.route.outputs.wf_sha }}
          # The UPSTREAM run id (not this alert run's GITHUB_RUN_ID): a re-run attempt of the
          # same failed run re-fires workflow_run; keying on it lets the receiver's
          # X-GitHub-Delivery idempotency drop the duplicate (t_101c01be: run 36170775010
          # paged twice, 11:09 and 11:21 PT 2026-09-25).
          WF_RUN_ID: ${{ steps.route.outputs.wf_run_id }}
          WF_URL: ${{ steps.route.outputs.wf_url }}
          WF_ACTOR: ${{ steps.route.outputs.wf_actor }}
          REPO: ${{ github.repository }}
          WF_EVENT: ${{ steps.route.outputs.wf_event }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "${CI_FAIL_WEBHOOK_SECRET:-}" ]; then
            echo "::error::CI_FAIL_WEBHOOK_SECRET is not set; cannot sign the alert." >&2
            exit 1
          fi
          # A replay is labelled and gets its own delivery id, so the receiver's
          # idempotency does not drop it when the original run already paged.
          DELIVERY="ci-fail-${WF_RUN_ID}"
          # #logs gets its own id: the receiver dedupes ids across ALL routes for an hour, so a re-run
          # that promotes a logged red to #alerts would be dropped as a duplicate (Prism P1
          # c171f8cb6512). Each route keeps its own re-run idempotency (t_101c01be).
          [ "${ROUTE:-alerts}" = logs ] && DELIVERY="${DELIVERY}-known"
          # Merge-queue ejection: PR + failing tests on the page's first line (t_70f92e0b).
          if [ -n "${SUMMARY:-}" ]; then
            WF_NAME="${WF_NAME} — ${SUMMARY}"
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            WF_NAME="[replay] ${WF_NAME}"
            DELIVERY="${DELIVERY}-replay-${GITHUB_RUN_ID}"
          fi
          # Say WHAT went red on the page's second line: a scheduled run is not a
          # merge, and GitHub reports a schedule's actor as whoever last touched the
          # workflow (github-merge-queue[bot] on 2026-09-30, run 36724184458), which
          # read as a merge regression (t_b4265523).
          case "$WF_EVENT" in
            schedule)    TRIGGER="scheduled run, not a merge"; WF_ACTOR="cron" ;;
            merge_group) TRIGGER="merge queue" ;;
            push)        TRIGGER="merge/push to ${WF_BRANCH}" ;;
            *)           TRIGGER="$WF_EVENT" ;;
          esac
          # Build the JSON body. event_type is what the receiver route filters
          # on (X-GitHub-Event header is also set to the same value):
          # ci_failure -> /ci-fail (#alerts), ci_failure_known_red -> /ci-fail-known (#logs).
          EVENT_TYPE=ci_failure
          if [ "${ROUTE:-alerts}" = "logs" ]; then
            EVENT_TYPE=ci_failure_known_red
            WEBHOOK_URL="${WEBHOOK_URL}-known"
          fi
          BODY="$(jq -nc \
            --arg event_type "$EVENT_TYPE" \
            --arg card "${CARD:-}" \
            --arg repo "$REPO" \
            --arg workflow "$WF_NAME" \
            --arg branch "$WF_BRANCH" \
            --arg sha "$WF_SHA" \
            --arg run_url "$WF_URL" \
            --arg actor "$WF_ACTOR" \
            --arg trigger "$TRIGGER" \
            --arg pr "${PR_NUM:-}" \
            '{event_type:$event_type, card:$card, repo:$repo, workflow:$workflow, branch:$branch, sha:$sha, run_url:$run_url, actor:$actor, trigger:$trigger, pr:$pr}')"
          # Generic HMAC-SHA256 hex over the raw body → X-Webhook-Signature.
          SIG="$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$CI_FAIL_WEBHOOK_SECRET" | sed 's/^.* //')"
          CODE="$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: ${EVENT_TYPE}" \
            -H "X-GitHub-Delivery: ${DELIVERY}" \
            -H "X-Webhook-Signature: ${SIG}" \
            --data "$BODY")" || CODE="000"
          # curl exits nonzero on a transport error (DNS, refused, timeout); under
          # set -e that would end the step before the #alerts fallback below runs.
          echo "Receiver responded HTTP $CODE"
          cat /tmp/resp.txt || true
          # 2xx = delivered/accepted. Non-2xx fails the step so the miss is visible.
          # A #logs (known-red) miss must still reach SOMEONE (C6, #1196): it is
          # re-sent to the #alerts route once, as a plain ci_failure. Only if that
          # also fails does the step go red.
          case "$CODE" in
            2*) echo "CI-failure event delivered (route=${ROUTE:-alerts})." ;;
            *)
              if [ "$EVENT_TYPE" = "ci_failure_known_red" ]; then
                echo "::warning::known-red #logs POST returned HTTP $CODE (card ${CARD}); falling back to #alerts"
                BODY="$(jq -c '.event_type = "ci_failure"' <<< "$BODY")"
                SIG="$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$CI_FAIL_WEBHOOK_SECRET" | sed 's/^.* //')"
                CODE="$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
                  -X POST "${WEBHOOK_URL%-known}" \
                  -H "Content-Type: application/json" \
                  -H "X-GitHub-Event: ci_failure" \
                  -H "X-GitHub-Delivery: ${DELIVERY}-alerts-fallback" \
                  -H "X-Webhook-Signature: ${SIG}" \
                  --data "$BODY")" || CODE="000"
                case "$CODE" in
                  2*) echo "known-red delivery failed; #alerts fallback delivered." ;;
                  *) echo "::error::known-red POST and #alerts fallback both failed (HTTP $CODE)" >&2; exit 1 ;;
                esac
              else
                echo "::error::CI-fail alert POST returned HTTP $CODE" >&2; exit 1
              fi ;;
          esac
