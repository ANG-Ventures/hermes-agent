# Fleet-added (Apollo/greploop posture-B floor). NOT upstream — do not expect on NousResearch/hermes-agent.
# Provides the `sast` deterministic-floor component. Diff-aware where it helps, full-tree gate at ERROR.
name: Fleet SAST (semgrep)

on:
  pull_request:
  push:
    branches: [main]
  # merge_group: required by the merge queue — the batched candidate must get a
  # sast result or the queue wedges. (semgrep full-tree at --severity=ERROR.)
  merge_group:

permissions:
  contents: read

concurrency:
  group: fleet-sast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: sast
    runs-on: ubuntu-latest
    # 2x measured p90 (46 s over 100 runs, max 124 s), floored at 10.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install semgrep
        run: pip install "semgrep==1.46.0"

      - name: Run semgrep (ERROR severity gate)
        run: |
          semgrep \
            --config=p/python \
            --config=p/secrets \
            --severity=ERROR \
            --error \
            --quiet \
            hermes/
