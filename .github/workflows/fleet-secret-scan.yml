# Fleet-added (Apollo/greploop posture-B floor). NOT upstream — do not expect on NousResearch/hermes-agent.
# Provides the `secret_scan` deterministic-floor component. DIFF-SCOPED on PRs: scans only the files the
# PR changed, NOT full history (the fork inherits ~768 generic-api-key false positives in upstream test
# fixtures/docs — a full-tree scan would pin this RED forever).
#
# HARDENED 2026-06-20 (greploop phase-3): the old `--log-opts=base..head` range was fragile —
# `pull_request.base.sha` is the base-branch TIP, not the merge-base, so the commit range could resolve
# empty/wrong and silently pass a real leak (observed in the A4 actuator drill: secret_scan=success on a
# PR that planted a key). Fix: compute the merge-base, take the exact CHANGED FILE LIST, and scan those
# files directly with `--no-git` (content scan, range-independent). A leak in any changed file → RED,
# regardless of how GitHub resolves SHAs.
name: Fleet Secret Scan (gitleaks)

on:
  pull_request:
  push:
    branches: [main]
  # merge_group: required by the merge queue — the batched candidate must get a
  # secret_scan result or the queue wedges. (Runs full-tree diff-scoped scan.)
  merge_group:

permissions:
  contents: read

concurrency:
  group: fleet-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret_scan:
    name: secret_scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Blobless: commit graph + trees, blobs fetched on demand. The scan
          # below only ever materializes the CHANGED files via
          # `git show <sha>:<path>`, so a full ~930 MiB pack is pure waste.
          # Measured on the self-hosted pool 2026-09-19 (ACE-AI, same host the
          # jobs run on): full clone 317 s / 929 MiB .git vs blobless 34 s /
          # 91 MiB. The job's own p50 is 199 s, of which the checkout step is
          # 189 s (95%). Diff-scoping is unchanged: merge-base, changed-file
          # list and scanned file BYTES were verified byte-identical between a
          # full and a blobless clone over a 31-file range (sha256 over every
          # materialized file).
          filter: blob:none

      - name: Install gitleaks
        run: bash .github/scripts/install-ci-tool.sh gitleaks

      - name: Compute changed files (merge-base diff, range-independent)
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            # The merge queue's batched candidate. github.event.before does NOT
            # exist on merge_group payloads -- leaving BASE_SHA empty tripped the
            # cat-file guard and fell through to a FULL-CONTENT scan of the whole
            # tree (7931 files), which flags pre-existing fixture "leaks" that a
            # changed-files scan never sees, failing every queue batch
            # (first observed 2026-07-27, run 30246321064).
            #
            # Use the TARGET BRANCH as the base, NOT merge_group.base_sha.
            # Measured 2026-09-19: queue candidate refs are CHAINED, so base_sha
            # is the PREVIOUS candidate (four deep above main with 5 entries
            # queued), not the projected main. On the candidate that actually
            # fast-forwards main (175d6be2) the payload base yields a 3-file
            # scan while the true incoming set is 12 -- a key added by any
            # member PR other than the topmost would merge UNSCANNED. Diffing
            # from merge-base(target, candidate) restores the full batch union.
            MG_BASE_REF="${{ github.event.merge_group.base_ref }}"
            BASE_SHA="origin/${MG_BASE_REF#refs/heads/}"
            HEAD_SHA="${{ github.event.merge_group.head_sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi
          # Ensure both SHAs are present locally (PRs from same repo: fetch the base too).
          git fetch -q origin "$BASE_SHA" 2>/dev/null || true
          git fetch -q origin "$HEAD_SHA" 2>/dev/null || true
          FULL_SCAN=0
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            # MERGE-BASE so the diff is exactly what the PR introduces, never a divergent range.
            MB="$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "$BASE_SHA")"
            git diff --name-only --diff-filter=ACMR "$MB" "$HEAD_SHA" > /tmp/changed.txt || true
          else
            # New branch / all-zero before / missing base: the diff-vs-(HEAD~1) fallback would
            # scan only the LAST commit of a multi-commit push and miss a key added in an earlier
            # commit of the same push (Greptile #74). FALL BACK TO A FULL-CONTENT SCAN of HEAD_SHA
            # instead — every tracked file at the head, no range assumption.
            echo "base unavailable -> FULL-CONTENT scan of HEAD_SHA"
            FULL_SCAN=1
            git ls-tree -r --name-only "$HEAD_SHA" > /tmp/changed.txt || true
          fi
          echo "full_scan=$FULL_SCAN" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "----- files to scan ($(wc -l < /tmp/changed.txt)) -----"; head -50 /tmp/changed.txt

      - name: Gitleaks (scan changed files at HEAD_SHA — range-independent)
        run: |
          if [ ! -s /tmp/changed.txt ]; then
            echo "no files to scan; pass"
            exit 0
          fi
          HEAD_SHA="${{ steps.changed.outputs.head_sha }}"
          # Materialize file BYTES from HEAD_SHA itself, NOT the working tree — the PR
          # checkout is refs/pull/N/merge (the prospective merge commit), whose bytes can differ
          # from the PR branch tip (Greptile #74). The archive below reads HEAD_SHA directly,
          # so it is the true PR content exactly as the old `git show HEAD_SHA:<path>` loop was.
          SCRATCH="$(mktemp -d)"
          trap 'rm -rf "$SCRATCH"' EXIT   # guarantee cleanup; no lingering unredacted content
          # ONE batched extraction instead of a per-file `git show` loop.
          #
          # The checkout above is a blobless partial clone, so every `git show
          # <sha>:<path>` on a blob we don't have triggers its OWN lazy fetch
          # round-trip to the remote. Measured on the pool host 2026-09-19:
          # the per-file loop over the 11,593-file FULL_SCAN fallback had not
          # finished after 20 min (vs 97 s on a full clone), i.e. blobless
          # alone would have turned the fallback into a job timeout.
          # `git archive` resolves the whole pathspec in a single batched
          # fetch: 31 files in 39 s and the entire 11,593-file tree in 31 s,
          # both byte-identical (sha256 over every extracted file) to the
          # full-clone result.
          #
          # xargs chunks the list so a large FULL_SCAN fallback can't blow
          # ARG_MAX; each chunk is one batched fetch. `git archive` here takes
          # POSITIONAL pathspecs on purpose: --pathspec-from-file is NOT
          # supported by git-archive on the pool image (git 2.43.0 — verified,
          # exits 129 "unknown option"), only by git-add/commit/checkout.
          # -0/-r pair with the NUL-delimited list so paths containing spaces
          # survive, and -r makes an empty list a no-op rather than an
          # archive-everything call. `set -o pipefail` + xargs's own non-zero
          # exit on a failed chunk keep a fetch error from silently yielding a
          # short scan that passes.
          set -o pipefail
          export SCRATCH
          # shellcheck disable=SC2016  # $0/$@ must be expanded by the inner sh, not here.
          tr '\n' '\0' < /tmp/changed.txt | \
            xargs -0 -r -n 500 sh -c \
              'git archive --format=tar "$0" -- "$@" | tar -x -C "$SCRATCH"' "$HEAD_SHA"
          echo "scanning $(find "$SCRATCH" -type f | wc -l) file(s) at HEAD_SHA with gitleaks --no-git"
          # Use the repo's allowlist config (fake test fixtures / doc placeholders).
          # gitleaks discovers .gitleaks.toml from the TARGET PATH, not CWD, and the
          # SCRATCH dir has none — so pass it explicitly or the allowlist is dead
          # (a whole-file re-scan of a touched test file would then trip on its fakes).
          gitleaks detect \
            --source "$SCRATCH" \
            --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --no-git \
            --no-banner \
            --redact \
            --exit-code 1
