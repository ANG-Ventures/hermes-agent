# .github/workflows/js-tests.yml
name: JS Tests

on:
  workflow_call:

jobs:
  check:
    name: JS & TS checks
    # One 32-core job replaces a 14-leg matrix. The matrix spread about 612s
    # of check payload over 4-core runners. It paid about 371s of repeated
    # setup to do it: 14 checkouts, 14 node installs, 14 node_modules
    # restores.
    #
    # One larger runner installs one time. vitest, tsc and eslint each size
    # their own worker pool from the core count.
    #
    # fork 2026-09-16: NOT routed through CI_RUNNER_LABELS. Pinned after the
    # `apps/desktop :: check:test:ui` leg died twice on merge_group refs with no
    # vitest summary (238.0s, 271.5s), while a `rerun --failed` on the same
    # commit came back 34 success / 0 failure.
    #
    # fork 2026-09-18: the original "4 CPU / 8g container ceiling" reading was
    # MEASURED AND FALSIFIED. Replayed this exact job at 5f7235803f inside the
    # real pool container shape (`--cpus 4 --memory 8g`, node:26-bookworm) on
    # ACE-AI:
    #   * full run-workspace-checks.mjs, idle host:  all 10 checks pass,
    #     check:test:ui 307.8s / 229.3s
    #   * same, with 3 extra pool-shaped containers pinning the host at
    #     load ~80: all 10 checks pass, check:test:ui stretches to 511.0s
    #   * check:test:ui alone, 3x and 4x concurrently: 7/7 exit 0
    # Peak container memory was 2.1 GiB of the 8 GiB cap and the cgroup reports
    # `oom_kill 0` — the job is not close to the memory ceiling, so a bigger
    # MEM_LIMIT buys nothing. Node 26 already honours the CPU quota
    # (`availableParallelism()` = 4 under `--cpus 4`), so the worker pools are
    # sized correctly and are not oversubscribing.
    #
    # Contention only makes this leg SLOWER, never red, and the 30 min timeout
    # has 4x headroom over the worst measured run. What the failing log actually
    # shows is a run that stops mid-flight with no summary and no per-file result
    # line at all — a different signature from a resource kill, and one that did
    # not reproduce in 8 replays. The real standing risk is that the host is
    # oversubscribed 106 committed vCPU / 232g across six pools on 24 cores and
    # 121g, so a pool container can be starved by its neighbours at any sizing.
    #
    # Stays GitHub-hosted: raising CPU_LIMIT/MEM_LIMIT for this repo would not
    # have fixed the observed failure, and would have deepened that host
    # oversubscription. Re-pointing this at the pool needs the mid-flight death
    # root-caused first, not a bigger box.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/node-workspace

      # Every check runs at the same time. The step fails only after all of
      # them finish. There are two reasons this is not ``npm run --ws check``.
      #
      #   * ``--ws`` is serial and stops at the first workspace that fails. A
      #     run then reports one failure, where the matrix this replaced
      #     reported every failure together.
      #   * The unit of work is a CHECK, and not a workspace. apps/desktop is
      #     most of the payload, and its own ``check`` is a serial && chain.
      #     A spread across workspaces alone leaves that chain as the long
      #     pole. This expands the ``check:*`` sub-scripts of a package, so
      #     its lint, ui, electron and plugin suites all run together. That
      #     is the same selection rule the old matrix job used.
      #
      # Discovery is ``npm query .workspace``. A new package or a new
      # ``check:*`` script needs no change here. An empty list is an error and
      # not an empty run, because an empty run reports green after it checks
      # nothing.
      #
      # ``--skip`` removes the one unit the ``ui-tests`` job below runs
      # sharded. The script errors if a skip matches no unit, so a rename of
      # that script cannot silently drop the suite from both jobs.
      - name: Run all workspace checks
        run: node .github/scripts/run-workspace-checks.mjs --skip 'apps/desktop::check:test:ui'

  ui-tests:
    # apps/desktop ``check:test:ui`` was the whole critical path of this
    # workflow and of the merge group: merge_group run 36217656078 spent
    # 656.7s in it (685 files / 6774 tests) while the other 9 checks were done
    # by 04:27, and it pushed the run to 11m26s. vitest's own breakdown was
    # import 747s + environment 644s + tests 329s of worker time — per-file
    # jsdom/import cost across 3 workers, so it splits linearly across
    # runners. ``--shard`` partitions the FILE list deterministically; every
    # file runs in exactly one shard, each shard in its own jsdom workers as
    # before. Same command as ``check:test:ui`` (``npm run test:ui``) plus the
    # shard flag.
    name: UI tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/node-workspace
      - name: vitest ui project, shard ${{ matrix.shard }}/3
        run: npm run --prefix apps/desktop test:ui -- --shard=${{ matrix.shard }}/3
