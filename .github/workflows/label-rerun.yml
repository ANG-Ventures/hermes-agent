name: Label rerun

# When the ``ci-reviewed`` label is added to a PR, rerun the latest CI run.
# This re-evaluates ``review-labels`` (which now sees the label) and the
# dependent ``all-checks-pass`` gate. Failed-only reruns of CI's dynamic
# matrix can fail at startup before creating any jobs.
#
# ``gh run rerun`` only works on a completed run. Thus this waits when the
# run is still in progress. The wait is now short. The two slowest jobs are
# the 40-minute comment poller and the 45-minute image build. Each one moved
# to its own workflow, so a CI run ends when its required jobs end.
#
# The live review-comment poller (ci-review-comment.yml) was retired on
# 2026-09-25 (CI efficiency spec L10); it had been disabled since before then.

on:
  pull_request:
    types: [labeled]

permissions:
  actions: write
  pull-requests: read

concurrency:
  group: label-rerun-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rerun-review-labels:
    name: Rerun review-labels job
    if: github.event.label.name == 'ci-reviewed'
    # Pure API poller (`gh run watch` for up to 35 min) — it never checks out
    # or builds the repo, so it must NOT take a self-hosted runner slot: on a
    # small self-hosted pool it sits on one runner waiting for the very CI run
    # that pool is trying to finish. Pin to GitHub-hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Wait for CI run to finish, then rerun CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Find the latest CI run for this PR's head SHA.
          RUN_INFO=$(gh run list \
            --repo "$REPO" \
            --commit "$HEAD_SHA" \
            --workflow ci.yaml \
            --limit 1 \
            --json databaseId,status \
            --jq '.[0] | "\(.databaseId) \(.status)"' 2>/dev/null || true)

          if [ -z "$RUN_INFO" ]; then
            echo "No CI run found for this PR — nothing to rerun."
            exit 0
          fi

          # Split "RUN_ID STATUS" into two vars. Read STATUS from RUN_INFO,
          # not from the truncated RUN_ID. Both values came from the same
          # var before, which made STATUS the run id. Thus the wait branch
          # always ran.
          RUN_ID="${RUN_INFO%% *}"
          STATUS="${RUN_INFO##* }"

          echo "Latest CI run: $RUN_ID (status: $STATUS)"

          # If the run is still in progress, wait for it to finish.
          # gh run rerun only works on completed runs — if we try while it's
          # running, GitHub rejects with "cannot be rerun; This workflow is
          # already running".
          if [ "$STATUS" != "completed" ]; then
            echo "Run is $STATUS — waiting for completion (this may take a while)..."
            # gh run watch --exit-status exits non-zero if the run fails,
            # which is expected (the label gate fails). Don't let that kill
            # the workflow — we WANT to rerun the completed run.
            timeout 2100 gh run watch "$RUN_ID" --repo "$REPO" --interval 15 || true

            # Verify it's actually completed now.
            STATUS=$(gh run view "$RUN_ID" --repo "$REPO" --json status --jq '.status' 2>/dev/null || echo "unknown")
            if [ "$STATUS" != "completed" ]; then
              echo "Run is still $STATUS after wait — giving up."
              exit 0
            fi
          fi

          ATT0=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.run_attempt' 2>/dev/null || echo 0)
          echo "Run completed (attempt $ATT0). Rerunning CI..."
          gh run rerun "$RUN_ID" --repo "$REPO"

          # VERIFY the new attempt actually started (t_bc0052b9). Re-runs of
          # ci.yaml have died at GitHub startup with 0 jobs and "An unexpected
          # error has occurred" (35533595904, 35898441649, 36070097433,
          # 36145913460, 36170775010). Such an attempt RESETS the check suite:
          # attempt 1's check runs, the required "All required checks pass"
          # included, drop out of the head's latest checks, and an armed
          # auto-merge waits for a check that never comes (#1086, 3 h). A full
          # rerun of the same run started normally 34 s later (36170775010
          # attempt 3). So: on startup_failure, full rerun again, 3 tries in
          # total, then fail this job loudly.
          for try in 1 2 3; do
            ATT="$ATT0"; ST=""; CONC="none"
            for _ in $(seq 1 24); do
              sleep 5
              read -r ATT ST CONC < <(gh api "repos/$REPO/actions/runs/$RUN_ID" \
                --jq '"\(.run_attempt) \(.status) \(.conclusion // "none")"' 2>/dev/null || echo "$ATT0 unknown none")
              # A new attempt that is running (or already concluded) is the answer.
              if [ "$ATT" -gt "$ATT0" ] && { [ "$ST" != "queued" ] || [ "$CONC" != "none" ]; }; then break; fi
            done
            echo "Attempt $ATT: status=$ST conclusion=$CONC"
            [ "$CONC" = "startup_failure" ] || break
            if [ "$try" -ge 3 ]; then
              echo "::error::CI run $RUN_ID attempt $ATT died at startup_failure 3 times; the head has NO required check runs. Re-run the whole workflow by hand."
              exit 1
            fi
            echo "::warning::CI run $RUN_ID attempt $ATT died at startup_failure (0 jobs). Full rerun $((try + 1))/3."
            ATT0="$ATT"
            gh run rerun "$RUN_ID" --repo "$REPO"
          done
          echo "Done. GitHub will rerun all CI jobs, including review-labels."
