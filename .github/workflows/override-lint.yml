# Override lint — thin caller (t_8f526b34). A PR that ADDS a refusal string (scoped paths, or a new
# raise/emit_block/sys.exit/HTTPException(409) with refusal wording) must carry an `Override:` line in
# its body naming the flag/env/reason field, or `Override: none by design — <why>`.
# Copy to .github/workflows/override-lint.yml. Pin `uses:` to an IMMUTABLE 40-hex commit SHA of
# ANG-Ventures/fleet-floor-workflows (never a moving tag).
#
# Placeholders:
#   debd27598fa6c6a4a250e211f7501f3698984120   40-char commit SHA of the central repo
#   ubuntu-latest      public repo: GitHub-hosted. Private ANG-Ventures repos use the org's metered runner label.
name: override-lint

# paths: the files the lint reads for hits (README "Caller path filters"). A PR outside them has no
# hits, so it passes whatever its body says. `edited` still re-runs the check on a body edit of a PR
# inside them: GitHub evaluates the filter against the PR's whole diff, not against the edit. Not a
# required check, so a filtered-out run does not leave a PR pending.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths:
      - '**'
      # Never read for hits (no CODE_EXT): docs, data, media, config.
      - '!**.md'
      - '!**.json'
      - '!**.jsonl'
      - '!**.txt'
      - '!**.log'
      - '!**.csv'
      - '!**.sse'
      - '!**.patch'
      - '!**.diff'
      - '!**.html'
      - '!**.svg'
      - '!**.png'
      - '!**.jpg'
      - '!**.jpeg'
      - '!**.gif'
      - '!**.webp'
      - '!**.pdf'
      - '!**.yml'
      - '!**.yaml'
      - '!**.toml'
      - '!**.plist'
      - '!**.service'
      - '!**.ini'
      - '!**.cfg'
      - '!**.lock'
      # Never read for hits: test paths (the lint's is_test()).
      - '!**/tests/**'
      - '!**/test/**'
      - '!**/__tests__/**'
      - '!**/testdata/**'
      - '!**/fixtures/**'
      - '!**/test_*'
      - '!**/conftest.py'
      # Fail open on a change to this caller (SHA bump, input change).
      - '.github/workflows/override-lint.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  override_lint:
    uses: ANG-Ventures/fleet-floor-workflows/.github/workflows/override-lint.yml@debd27598fa6c6a4a250e211f7501f3698984120
    with:
      runner: ubuntu-latest
      # Repos whose skills live elsewhere: pass the dirs grepped for the named override (warning only).
      # docs-paths: "skills-shared skills"
      # Reviewed no-override-by-design additions, one per line (`path:<regex> <why>` / `line:<regex> <why>`):
      # allowlist: |
      #   line:my refusal text reviewed in PR #N
