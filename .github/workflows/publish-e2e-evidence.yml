name: Publish E2E evidence

# This runs only from the default branch after CI completes. It intentionally
# checks out main, never the PR ref, and treats the downloaded artifact as
# untrusted input before uploading validated GitHub attachments.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: publish-e2e-evidence-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish inline E2E evidence
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    environment: gh-image
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # v1.2.0 resolves to 44f4b93ecbbe22de6c45fa2f62f519aee564ca8c.
      - name: Install gh-image
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install drogers0/gh-image --pin v1.2.0

      - name: Download and attach evidence
        # Deliberately NO ``continue-on-error``. Every call in this step
        # spends the shared installation rate-limit budget, and when that
        # budget ran out on 2026-09-19 the step failed 10 times and painted
        # a red X on PRs that had nothing wrong with them — but suppressing
        # the whole step also swallowed missing artifacts, bad credentials
        # and a broken gh extension, letting the workflow report success
        # while attaching nothing, which is its entire job.
        #
        # ``publish_evidence_step.sh`` therefore tolerates ONLY the
        # rate-limit class and reds the step on everything else.
        #
        # The OSV scan's SARIF upload is deliberately NOT given any such
        # treatment: ``osv-scanner`` IS in ``all-checks-pass.needs``, so
        # silencing it would hide a required check.
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_SESSION_TOKEN: ${{ secrets.GH_IMAGE_SESSION_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          bash scripts/ci/publish_evidence_step.sh
