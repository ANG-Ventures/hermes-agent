# Regression-test lint — thin caller (t_d1ac622f). A FIX PR (fix/hotfix/bug/regress/repair/restore/parity
# title or branch) that changes code must add or change a test file, or carry ONE body line
#   no-regression-test: <reason, >= 15 chars>
# Copy to .github/workflows/regression-test-lint.yml. Pin `uses:` to an IMMUTABLE 40-hex commit SHA of
# ANG-Ventures/fleet-floor-workflows (never a moving tag).
#
# Placeholders:
#   __FLOOR_SHA__   40-char commit SHA of the central repo
#   __RUNNER__      private ANG-Ventures repo: ${{ vars.CI_RUNNER || 'universal-ci' }} (x64 only).
#                   Public or Kyzcreig repo: ubuntu-latest.
name: regression-test-lint

# path-filter-exempt: whole-tree-scan t_d1ac622f no `paths:` on purpose. The lint reads the PR as a whole (a test file anywhere
# satisfies a code change anywhere), and GitHub drops a filtered workflow on a >3,000-file diff whose
# matches sort late. It reads only the REST file list (no checkout) and finishes in seconds. Not a
# required check (making it one is Apollo's call).
on:
  pull_request:  # no-paths-ok: reads the PR title/body/file list, not the tree; see path-filter-exempt above
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  regression_test_lint:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft || vars.CI_RUN_ON_DRAFTS == '1' }}
    uses: ANG-Ventures/fleet-floor-workflows/.github/workflows/regression-test-lint.yml@38d6a1cb2f634d0b24fa81369eb28780c0e16776
    with:
      runner: ubuntu-latest
