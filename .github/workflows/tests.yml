name: Tests

# Test-impact rule: a pull request whose entire diff is confined to one
# plugins/<name>/ tree (plus tests/plugins/<name>/) runs that plugin's tests
# and one pinned gateway/session/config smoke slice. Any other, uncertain,
# cross-plugin, conftest, pyproject, or workflow path fails open to the full
# slice_count matrix. merge_group is scoped the same way, over the batch's
# three-dot diff from the target branch (base_ref...head_sha, NOT base_sha,
# which is the previous chained candidate); every other non-PR event runs full.
on:
  workflow_call:
    inputs:
      slice_count:
        description: Number of parallel test slices
        type: number
        default: 8
      test_scope:
        description: Isolated plugin scope from detect-changes, or full.
        type: string
        default: full
      changed_files:
        description: JSON list of changed paths (pull_request only) for test-impact selection.
        type: string
        default: "[]"
      # The E2E jobs below are slow lanes (scripts/ci/classify_changes.py).
      # ci.yaml passes the classifier's answer; a caller that passes nothing
      # gets every job.
      e2e:
        description: Run the e2e job (tests/e2e except the upgrade suite).
        type: boolean
        required: false
        default: true
      e2e_upgrade:
        description: Run the e2e-upgrade shards (tests/e2e/core/upgrade).
        type: boolean
        required: false
        default: true

permissions:
  contents: read

# Cancel in-progress runs for the same ref
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: "Generate slices"
    # Local Python + GitHub cache only; start hosted overflow without the pool.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # The static split (CI_RUNNER_LABELS + CI_SELF_HOSTED_SLOTS). Every
      # non-merge_group event runs it, and so does a managed merge_group with
      # no validated plan (t_42bed567). The all-local twin is placement's INPUT
      # artifact only, never a fallback: on 2026-09-25 it put all 9 slices on a
      # drained/capped pool and merged nothing for 3h20m.
      matrix: ${{ steps.matrix.outputs.matrix }}
      request_digest: ${{ steps.request.outputs.artifact-digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Record executed tree
        # L2(a) re-run guard (spec §5.1): the Actions API head_sha of a
        # pull_request run is the PR HEAD, not the refs/pull/N/merge commit
        # this run checked out. The guard reads tests.yml at THIS sha (from
        # this annotation) to decide whether "re-run failed jobs" is safe.
        run: echo "::notice title=ci-executed-sha::${GITHUB_SHA}"

      - name: Restore duration cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          # Per-run primary key so it can NEVER exact-hit. A legacy 3.5 KB entry
          # saved under the bare key `test-durations` (2026-06-02) exact-matched
          # every run, so the prefix fallback below never fired and LPT sliced
          # ~4,000 files on ~40 stale durations (the rest defaulted to 2.0 s ->
          # path order; heavy files started last and set the slice tail).
          # Restore = the newest `test-durations-<run_id>` saved by save-durations.
          key: test-durations-restore-${{ github.run_id }}
          restore-keys: |
            test-durations-

      - name: Generate test slices
        id: matrix
        env:
          # Per-slice runner routing. Slices 1..CI_SELF_HOSTED_SLOTS are
          # stamped with CI_RUNNER_LABELS; the rest spill to ubuntu-latest.
          # GitHub will not overflow a full self-hosted pool onto hosted
          # runners by itself, and one `runs-on` for the whole matrix cannot
          # express the split.
          #
          # Measured on merge_group run 35517572423 (2026-09-20, 30 real jobs):
          # 26 of them wanted the 17-slot self-hosted pool — 16 test slices
          # plus 10 non-test jobs — so mean job queue-wait was 4.6 min and max
          # 14.4 min against a mean job RUN of 3.3 min. Jobs waited longer than
          # they ran: the limiter was SLOT COUNT, not slice speed. Hosted
          # minutes are free on this public repo (20 concurrent jobs), so the
          # overflow tail costs nothing and the matrix starts in one wave.
          #
          # Both vars are optional and fail SAFE: unset CI_SELF_HOSTED_SLOTS
          # means no cap (every slice self-hosted, i.e. today's behaviour),
          # and unset/garbage CI_RUNNER_LABELS falls back to ubuntu-latest —
          # so the existing rollback (point CI_RUNNER_LABELS at ubuntu-latest
          # to route everything hosted) still works unchanged.
          CI_SELF_HOSTED_SLOTS: ${{ vars.CI_SELF_HOSTED_SLOTS }}
          CI_RUNNER_LABELS: ${{ vars.CI_RUNNER_LABELS }}
          # Optional trial: overrides routing for the N lightest non-core slices.
          CI_ARM_HOSTED_SLICES: ${{ vars.CI_ARM_HOSTED_SLICES }}
          # Arm-first (spec L5): with ARM on, every hosted non-core slice goes
          # to ubuntu-24.04-arm (3.4 vs 5.1 min p50, 2026-09-25 audit) except
          # this many, which stay x64 as arch canaries whatever K the
          # placement controller writes. Rollback: CI_X64_HOSTED_MIN=off.
          CI_X64_HOSTED_MIN: ${{ vars.CI_X64_HOSTED_MIN || '2' }}
          # Paid third rung (free self-hosted -> free GitHub-hosted ->
          # Blacksmith): the last N GitHub-hosted slices move to Blacksmith,
          # same arch. Written by the host ci-placement.py controller only
          # under measured hosted contention; unset/0 = off. The generator
          # enforces the trust guard itself: push, merge_group and same-repo
          # pull_request only — fork PRs never leave GitHub.
          CI_BLACKSMITH_SLICES: ${{ vars.CI_BLACKSMITH_SLICES }}
          EVENT_NAME: ${{ github.event_name }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          # pull_request pre-filter (t_e8c5045e): run only the test files that
          # can observe the diff (scripts/ci/test_impact.py), on a matrix
          # scaled to their share of the suite. merge_group and push:main are
          # never narrowed. Any selector failure or ambiguity -> full matrix.
          # Rollback: vars.CI_PR_TEST_IMPACT=off.
          CHANGED_FILES: ${{ inputs.changed_files }}
          PR_TEST_IMPACT: ${{ vars.CI_PR_TEST_IMPACT }}
        run: |
          SLICES=${{ inputs.slice_count }}
          IMPACT_ARGS=()
          if [ "$EVENT_NAME" = pull_request ] && [ '${{ inputs.test_scope }}' = full ] \
             && [ "$CHANGED_FILES" != '[]' ] && [ "$PR_TEST_IMPACT" != off ]; then
            IMPACT=$(printf '%s' "$CHANGED_FILES" \
              | python3 -c 'import json, sys; print("\n".join(json.load(sys.stdin)))' \
              | python3 scripts/ci/test_impact.py --event "$EVENT_NAME" \
                  --durations test_durations.json --full-slices "$SLICES" \
                  --files-out ci-impact-files.txt) || IMPACT='{"slices": 0}'
            echo "test impact: $IMPACT"
            N=$(printf '%s' "$IMPACT" | python3 -c 'import json, sys; print(int(json.load(sys.stdin)["slices"]))') || N=0
            if [ "$N" -gt 0 ] && [ -s ci-impact-files.txt ]; then
              SLICES=$N
              IMPACT_ARGS=(--files-from ci-impact-files.txt)
            fi
          fi
          MATRIX=$(python3 scripts/run_tests_parallel.py \
            --generate-slices "$SLICES" \
            "${IMPACT_ARGS[@]}" \
            --test-scope '${{ inputs.test_scope }}' \
            --self-hosted-slots "$CI_SELF_HOSTED_SLOTS" \
            --self-hosted-labels "$CI_RUNNER_LABELS" \
            --arm-hosted-slices="$CI_ARM_HOSTED_SLICES" \
            --x64-hosted-min="$CI_X64_HOSTED_MIN" \
            --blacksmith-slices="$CI_BLACKSMITH_SLICES" \
            --event="$EVENT_NAME" \
            --same-repo="$SAME_REPO")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          # A full matrix (~350 KB) exceeds Linux's 128 KB per-env-string limit
          # (E2BIG), so overflow tooling reads it from a file, never env/argv.
          mkdir -p ci-overflow
          printf '%s' "$MATRIX" > ci-overflow/matrix.json

      - name: Build CI overflow request and local matrix
        # Relabels the matrix above; never recomputes membership. Writes
        # ci-overflow/{request,local_matrix,static_matrix}.json. The request
        # holds slice ids, core flag and duration weights only — no files,
        # no test contents, no shell. The external ci-overflow-controller reads
        # it with its own credential; nothing privileged enters this workflow.
        id: overflow
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANAGED_PLACEMENT: ${{ vars.CI_OVERFLOW_PLACEMENT_ENABLED == 'true' }}
        run: |
          python3 scripts/ci_overflow_request.py --matrix-file ci-overflow/matrix.json --out-dir ci-overflow --event "$EVENT_NAME" --managed "$MANAGED_PLACEMENT"

      - name: Upload CI overflow request
        id: request
        # A failed upload only means no plan: test/e2e fall back to the static split.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-overflow-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-overflow/request.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload local matrix for placement
        # Placement's input (too large for env). Not the controller's request.
        # Also carries the plan-read script and the scripts.* modules it imports
        # (pinned by the workflow contract test), so Placement runs no checkout:
        # a 3 s checkout took 23-87 s on the CB5 tail runs of 09-27 (t_eb230c34).
        # The artifact root is the common ancestor (the workspace), so Placement
        # downloads it to `.` and finds ci-overflow/ and scripts/ where they were.
        if: github.event_name == 'merge_group' && vars.CI_OVERFLOW_PLACEMENT_ENABLED == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-overflow-local-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-overflow/local_matrix.json
            scripts/ci_overflow_placement.py
            scripts/ci_overflow_plan.py
            scripts/ci_overflow_request.py
            scripts/run_tests_parallel.py
            scripts/ci/list_os_marked_tests.py
          if-no-files-found: error
          retention-days: 1

  # Read-only consumer of the external controller's ledger plan (spec §5.1).
  # merge_group only; any failure/timeout/mismatch leaves plan_valid unset or
  # false and the test/e2e jobs below select the STATIC split instead
  # (generate.outputs.matrix / the CI_RUNNER_LABELS e2e label) — never all-local.
  placement:
    name: Placement
    needs: generate
    # Phase-2 static-routing switch: absent/invalid stays on the existing K/ARM
    # split until Apollo explicitly activates managed placement in Phase 4.
    if: github.event_name == 'merge_group' && vars.CI_OVERFLOW_PLACEMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A dead placement (checkout/runner failure, 5-min kill) must not fail the
    # required check: the static-split fallback still runs every slice. Only a
    # validated plan ever writes plan_valid=true, so this cannot admit one.
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      e2e_runs_on: ${{ steps.plan.outputs.e2e_runs_on }}
      plan_valid: ${{ steps.plan.outputs.plan_valid }}
      # The run_attempt this plan was admitted for. "Re-run failed jobs" reuses
      # this job's outputs in attempt N+1 WITHOUT re-running it, so test/e2e take
      # the plan only when plan_attempt == github.run_attempt; a selective re-run
      # therefore runs the static split (no allowance). A full re-run re-plans.
      plan_attempt: ${{ steps.plan.outputs.plan_attempt }}
    steps:
      # No checkout (t_eb230c34). Even sparse (#1311), actions/checkout was the
      # whole CB5 tail of 09-27 window 4: 87/39/30/25/23 s vs 3 s on fast runs,
      # GitHub's server-side pack generation for this repo being that variable.
      # The plan read needs four .py files; generate ships them in this same
      # artifact (see "Upload local matrix for placement"), from the same SHA.
      - name: Download local matrix and plan-read script
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-overflow-local-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Read validated plan from ci-overflow-ledger
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_REPOSITORY_ID: ${{ github.repository_id }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_HEAD_SHA: ${{ github.sha }}
          CI_REQUEST_DIGEST: ${{ needs.generate.outputs.request_digest }}
          CI_MATRIX_FILE: ci-overflow/local_matrix.json
        run: python3 scripts/ci_overflow_placement.py place

  test:
    name: Run tests ${{ matrix.slice.name }}
    needs: [generate, placement]
    # always(): run even though placement is skipped (non-merge_group) or
    # failed/timed out (merge_group static fallback). Placement changes labels
    # only; membership always comes from generate.
    if: always() && !cancelled() && needs.generate.result == 'success'
    # Per-slice runner class, stamped by the generate job (see its
    # `Generate test slices` step for the measurement and the fail-safe
    # semantics). Not `vars.CI_RUNNER_LABELS` directly: one label set for the
    # whole matrix cannot spill, and GitHub will not overflow a full
    # self-hosted pool onto hosted runners by itself.
    runs-on: ${{ fromJSON(matrix.slice.runs_on) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Static routing remains the default for every event, including
      # merge_group, until Phase-4 activation. Managed placement is selected
      # only with the explicit switch; no validated plan -> the static split.
      matrix: ${{ fromJSON((github.event_name != 'merge_group' || vars.CI_OVERFLOW_PLACEMENT_ENABLED != 'true') && needs.generate.outputs.matrix || needs.placement.result == 'success' && needs.placement.outputs.plan_valid == 'true' && needs.placement.outputs.plan_attempt == format('{0}', github.run_attempt) && needs.placement.outputs.matrix || needs.generate.outputs.matrix) }}
    steps:
      # Checkout is the largest per-slice fixed cost (t_37cf312c: median 6 s,
      # mean 10 s, max 89 s on blacksmith-4vcpu for a ~1 GB repo). Blacksmith's
      # fork of actions/checkout keeps a bare git mirror on a sticky disk and
      # fetches only the delta. Off Blacksmith (hosted / self-hosted slices)
      # BLACKSMITH_VM_ID is unset and it runs the upstream checkout code path.
      - name: Checkout code
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1

      - name: Install ripgrep (prebuilt binary)
        run: bash .github/scripts/install-ci-tool.sh ripgrep

      - name: Set up locked Python and test dependencies
        # PM-pinned interpreter + an isolated test environment (dev/test
        # groups); exports HERMES_PYTHON. The hermetic test env forbids
        # mid-run pip installs (HERMES_DISABLE_LAZY_INSTALLS=1 in tests/conftest.py), so
        # the lazy-install SDKs tests exercise for real (tools/lazy_deps.py)
        # are declared here up front.
        uses: ./.github/actions/setup-pm
        with:
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Check SQLite runs WAL
        # Hermes picks DELETE journal mode on a SQLite with the WAL-reset
        # bug. If the PM-pinned interpreter links one, every WAL test silently
        # runs DELETE (or skips), so fail loudly instead. Tests that need DELETE
        # select it explicitly (journal_mode config, a pinned vulnerable
        # version), so they run on any interpreter.
        run: |
          "$HERMES_PYTHON" -c "import sqlite3, sys, hermes_state_wal as w; v = w.is_sqlite_wal_reset_vulnerable(); print(f'Python {sys.version.split()[0]}, SQLite {sqlite3.sqlite_version}, WAL-reset vulnerable: {v}'); sys.exit(1 if v else 0)"

      - name: Restore per-file duration cache
        # scripts/run_tests_parallel.py raises a file's timeout to
        # 3x its last healthy duration (_effective_file_timeout) so a
        # known-slow file dilated by load is not SIGKILL'd at the flat cap
        # and laundered into a FLAKY retry. The scaler reads
        # test_durations.json from the checkout; without this restore the
        # file is absent on a fresh runner and the scaler is inert.
        # Exact key never matches (run_id differs); restore-keys picks the
        # most recent cache saved by a main push. PRs read, only main writes.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test_durations.json
          key: test-durations-never-exact
          restore-keys: |
            test-durations-

      - name: Run tests (${{ matrix.slice.name }})
        id: tests
        # The slice verdict below decides pass/fail (spec I4): a failure made
        # only of actively quarantined tests is non-gating; everything else,
        # including a missing result, stays red.
        continue-on-error: true
        # Per-file isolation via scripts/run_tests.sh: each test file runs
        # in its own freshly-spawned `python -m pytest <file>` subprocess
        # with bounded parallelism. No xdist, no shared workers, no
        # module-level state leakage between files.
        #
        # File list is pre-computed by the generate job (--generate-slices)
        # which runs LPT distribution once and passes the file list to each
        # matrix job via --files. Previously each job re-discovered files and
        # re-ran LPT independently — redundant N times.
        run: |
          # Verbose pytest output lets timeout verdicts name the last test reached.
          scripts/run_tests.sh --files '${{ matrix.slice.files }}' \
            --junit-dir ci-junit --result-file ci-junit/slice-result.json -- -v
        env:
          HERMES_TEST_FILE_TIMEOUT: "600"
          # Ensure tests don't accidentally call real APIs
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
          # Subprocess-per-file is import/IO-bound, not CPU-bound: workers spend
          # most of their wall time in interpreter boot + module import, not
          # computing. This is a CEILING, not an absolute — run_tests_parallel.py
          # clamps it to max(2, effective_cpus*2) where effective_cpus comes from
          # the cgroup CPU quota, not nproc. So a 4-vCPU hosted runner still gets
          # 8, while a --cpus=2 self-hosted container gets 4 instead of 12.
          # (12 on 2 CPUs was 6x oversubscription: CFS throttling blew wall-clock
          # windows and sqlite busy-timeouts, ejecting merge-queue entries.)
          # HERMES_TEST_WORKERS_FORCE=1 bypasses the clamp.
          HERMES_TEST_WORKERS: "12"

      - name: Upload per-file junit + slice manifest
        # Evidence for the flake ledger / quarantine gate: the gate re-derives
        # red->green pairs from THESE artifacts, named per slice AND attempt so
        # a "re-run failed jobs" attempt never overwrites attempt 1.
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-slice-result-${{ matrix.slice.index }}-a${{ github.run_attempt }}
          path: ci-junit/
          if-no-files-found: warn
          retention-days: 14

      - name: Slice verdict (flake quarantine, base-ref list)
        # Green iff the suite passed, or every failure is a test that is
        # actively quarantined in the BASE ref's list (never the PR head's —
        # a PR cannot exempt the test it broke). Checker + list both come
        # from the base; if the base has neither, any failure gates.
        if: ${{ !cancelled() }}
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
        run: |
          if [ "$TESTS_OUTCOME" = "success" ]; then
            echo "tests passed"
            exit 0
          fi
          if [ "$TESTS_OUTCOME" != "failure" ]; then
            echo "::error::tests step outcome '$TESTS_OUTCOME' — gating"
            exit 1
          fi
          if ! { git fetch --no-tags --depth=1 origin "$BASE_SHA" \
                 && git show "$BASE_SHA:scripts/ci/flake_quarantine.py" > "$RUNNER_TEMP/fq_base.py" \
                 && git show "$BASE_SHA:scripts/ci/flake_quarantine.json" > "$RUNNER_TEMP/fq_base.json"; }; then
            echo "::error::no quarantine checker/list on base $BASE_SHA — the failure gates"
            exit 1
          fi
          "$HERMES_PYTHON" "$RUNNER_TEMP/fq_base.py" slice-verdict \
            --tests-outcome "$TESTS_OUTCOME" \
            --result ci-junit/slice-result.json --junit-dir ci-junit \
            --quarantine "$RUNNER_TEMP/fq_base.json"

      - name: Upload per-slice durations
        # Advisory artifact (feeds slice balancing) — a transient artifact-
        # service blip must not fail an otherwise-green test slice.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-durations-slice-${{ matrix.slice.index }}
          path: test_durations.json
          retention-days: 1

  # Merge per-slice duration data into a single cache, so future runs
  # (including PRs) get balanced slicing.
  save-durations:
    needs: test
    # !cancelled() replaces the implicit success(), which also failed on the
    # always-skipped `placement` ancestor of `test` and skipped this job on
    # every push:main run since #938 (last cache written 2026-09-24T15:30Z).
    if: "!cancelled() && needs.test.result == 'success' && github.ref == 'refs/heads/main'"
    # Artifact/cache plumbing needs no LAN or self-hosted test slot.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all slice durations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-durations-slice-*
          path: durations
          # NO merge-multiple: every slice uploads the SAME inner filename
          # (test_durations.json), so merging them into one directory makes
          # 10 concurrent extractions race on one path — observed corrupt
          # concatenated JSON ("Extra data", run 29165269635) and, even when
          # it "works", silent last-writer-wins data loss of 9/10 slices.
          # Without merge-multiple each artifact lands in its own
          # durations/test-durations-slice-N/ subdir — no shared paths.

      - name: Merge into single durations file
        run: |
          python3 -c "
          import json, glob, os, sys
          merged = {}
          files = sorted(glob.glob('durations/**/test_durations.json', recursive=True))
          bad = 0
          for f in files:
            try:
              with open(f) as fh:
                merged.update(json.load(fh))
            except (json.JSONDecodeError, OSError) as e:
              # One unreadable slice must not sink the aggregate cache —
              # but zero readable slices should fail loudly.
              bad += 1
              print(f'WARNING: skipping unreadable {f}: {e}', file=sys.stderr)
          if not files:
            sys.exit('no slice duration files found — artifact pattern matched nothing')
          if bad == len(files):
            sys.exit(f'all {bad} slice duration files unreadable')
          with open('test_durations.json', 'w') as fh:
            json.dump(merged, fh, indent=2, sort_keys=True)
          print(f'Merged {len(merged)} file durations from {len(files) - bad}/{len(files)} slices')
          "

      - name: Save merged duration cache
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          key: test-durations-${{ github.run_id }}

  e2e:
    needs: [generate, placement]
    if: always() && !cancelled() && needs.generate.result == 'success' && inputs.e2e
    # Managed mode with a validated, attempt-bound plan uses its labels; every
    # other case (static routing, switch OFF, or no plan) uses the legacy X64
    # expression over CI_RUNNER_LABELS — never a fixed local pool (t_42bed567).
    # The static last-resort label is Blacksmith 4vCPU (a literal, never a
    # vars.* expression: ci_overflow_integration.fallback_predicate and
    # tests/ci/test_plumbing_runner_routing pin it so the fallback can never
    # resolve to an unset variable). e2e ran 26 min on 2-core ubuntu-latest
    # across #1624 rounds 4-7 (2026-10-03).
    # VM-class lane (t_78d851d1, Ace ladder 2026-10-03 rung 3): when the kill switch
    # CI_E2E_VM_ENABLED is 'true' AND the Studio load gate (hermes-home
    # scripts/ci-e2e-vm-gate.py) has set CI_E2E_VM_ROUTE=open (an ace-e2e-vm host
    # reports load1 < nproc-8 and no inference/transcode burst), the job goes to
    # the ace-e2e-vm runner on ACE-AI / ACE-MEDIA. Otherwise it falls through to
    # the unchanged static tail below.
    # TRUST GUARD (same rule as CI_BLACKSMITH_SLICES above): only push, merge_group and same-repo
    # pull_request may reach the VM class. Fork PRs and workflow_dispatch never leave GitHub /
    # Blacksmith: the class runs with seccomp/AppArmor unconfined on hosts we live on.
    # The core suites spawn real serve / gateway / tui_gateway / MCP / SQLite
    # writer processes per test; HERMES_TEST_WORKERS below bounds the trees.
    runs-on: ${{ fromJSON(github.event_name == 'merge_group' && vars.CI_OVERFLOW_PLACEMENT_ENABLED == 'true' && needs.placement.result == 'success' && needs.placement.outputs.plan_valid == 'true' && needs.placement.outputs.plan_attempt == format('{0}', github.run_attempt) && needs.placement.outputs.e2e_runs_on || vars.CI_E2E_VM_ENABLED == 'true' && vars.CI_E2E_VM_ROUTE == 'open' && (github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","Linux","X64","ace-e2e-vm"]' || (contains(fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]'), 'self-hosted') && format('["{0}","X64"]', join(fromJSON(vars.CI_RUNNER_LABELS), '","')) || '["blacksmith-4vcpu-ubuntu-2404"]')) }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Set up locked Python, Node and test dependencies
        # toolchain: all puts PM's locked Node in the runner's PM store, not
        # only on PATH. The E2E sandboxes copy node from that store
        # (tests/e2e/core/_pm_dependencies.py) and forbid lazy installs, and
        # the dashboard's /api/pty resolves the TUI's node through PM only.
        # A setup-node binary on PATH is invisible to PM, so every /api/pty
        # chat refused to start. The locked Node also satisfies the
        # boot-contract suite (backend-ready.ts needs Node >= 22.18).
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          # `messaging`: tests/e2e/core/platforms runs the real Telegram/Discord/Slack
          # adapters (their SDKs) against local stand-ins.
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "messaging"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Install Node deps and build the Ink TUI
        # tests/e2e/core/terminal drives the real `hermes --tui` over a PTY;
        # HERMES_E2E_REQUIRE_TUI=1 below turns a missing build into a failure.
        uses: ./.github/actions/retry
        with:
          command: npm ci --workspace ui-tui --ignore-scripts --no-audit --no-fund && npm run build --workspace ui-tui

      - name: Install ripgrep (prebuilt binary)
        run: bash .github/scripts/install-ci-tool.sh ripgrep

      - name: Require a WAL-capable SQLite
        # The state.db suites skip on a WAL-reset-vulnerable SQLite; fail
        # instead of reporting green over zero coverage.
        run: |
          "$HERMES_PYTHON" -c "import sqlite3, hermes_state_wal as w; print('sqlite', sqlite3.sqlite_version); assert not w.is_sqlite_wal_reset_vulnerable()"

      - name: Run e2e tests
        # One subprocess per file, in parallel: the core suites spawn real
        # processes (serve, gateway, tui_gateway, MCP servers, SQLite writers)
        # and must not share interpreter state.
        # tests/e2e/core/upgrade runs in its own job (e2e-upgrade) below.
        run: |
          mapfile -t files < <(find tests/e2e -name 'test_*.py' -not -path 'tests/e2e/core/upgrade/*' | sort)
          # -o faulthandler_timeout=120 (fork, #792): a stalled e2e test dumps
          # every thread's stack to stderr after 120 s, so the per-file
          # SIGKILL and the job timeout below leave evidence instead of a bare
          # "process tree SIGKILL'd". Bare pytest flags pass through the runner.
          scripts/run_tests.sh --include-integration "${files[@]}" -o faulthandler_timeout=120
        env:
          # An e2e file is a process tree, not one CPU-bound pytest worker. With
          # 32 files at once the hosted run starved live children before their
          # ready frames (empty stderr, still alive) and hit 60–120s deadlines
          # across unrelated SQLite, tenancy, provider and terminal suites.
          # Bound the trees, not the child readiness/turn timeouts. At 4 the
          # PTY turn and serve-SIGTERM deadlines still starved intermittently.
          HERMES_TEST_WORKERS: "3"
          # Multi-process episodes (torture chamber, compaction kill -9,
          # gateway liveness, delivery exactly-once through a real gateway,
          # the cron virtual-clock soak) legitimately run past the 300 s default.
          HERMES_TEST_FILE_TIMEOUT: "900"
          # No automatic re-run of a failed file: the torture chamber and the
          # exactly-once/compaction suites are race detectors, and a rare
          # corruption that passes on retry is still a corruption.
          HERMES_TEST_FILE_RETRIES: "0"
          HERMES_E2E_REQUIRE_TUI: "1"
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  e2e-upgrade-plan:
    # One e2e-upgrade shard per TEST FILE: "<suite>/<file-stem>" for every
    # test_*.py directly under tests/e2e/core/upgrade (suite "core") and under
    # each suite subdirectory (pm, git, handoff, network, hosts, ...). A new
    # file or directory gets its own shard without editing this file. Per-file
    # because the lane runs on Blacksmith, which bills vCPU-minutes, not jobs
    # (Ace 2026-10-03): N short jobs cost what one long one does, and the lane's
    # wall time becomes its slowest FILE (~3-5 min) instead of its slowest
    # directory (pm, 11 min on 4 vCPU; git was 48 min on 2-core ubuntu-latest).
    # The run step still accepts a bare directory name, so a hand-dispatched
    # "git" shard keeps working. Skipping this job skips every shard with it.
    if: inputs.e2e_upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          sparse-checkout: tests/e2e/core/upgrade
      - name: List suite directories
        id: plan
        run: |
          set -euo pipefail
          shards=$(python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path("tests/e2e/core/upgrade")
          shards = sorted(f"core/{f.stem}" for f in root.glob("test_*.py"))
          for d in sorted(root.iterdir()):
              if d.is_dir() and not d.name.startswith(("_", ".")):
                  shards += sorted(f"{d.name}/{f.relative_to(d).with_suffix('').as_posix()}"
                                   for f in d.rglob("test_*.py"))
          print(json.dumps(shards))
          PY
          )
          echo "shards=$shards" | tee -a "$GITHUB_OUTPUT"

  e2e-upgrade:
    # tests/e2e/core/upgrade: a real N-1 -> HEAD `hermes update` (clean,
    # autostash, killed mid-pull / mid-deps, offline), fresh-process import and
    # entrypoint smoke, the config round-trip property matrix, and the lane
    # suites below it (pm: PM environment lifecycle across updates, ...).
    # Its own job: it needs full history + tags, bubblewrap, and one file
    # runs ~5-15 min. Sharded by suite directory (see e2e-upgrade-plan).
    name: e2e-upgrade (${{ matrix.shard }})
    needs: e2e-upgrade-plan
    # Hosted by design: installs bubblewrap with sudo apt-get and relaxes the
    # unprivileged-userns sysctl; the self-hosted pool runs no-new-privileges
    # containers (see the RUNNERS note in ci.yaml). Blacksmith VMs allow both
    # (hermes-home runs apt on them). Measured 2026-10-03 on #1624 rounds 4-7:
    # the (git) shard took 48 min on 2-core ubuntu-latest and set every round's
    # wall clock (52 min); upstream runs this job on a 32-core pool. Repo var
    # CI_E2E_RUNNER overrides (outage fallback: set it to ubuntu-latest).
    # VM-class lane (t_78d851d1): same switch + gate as the e2e job above. The
    # ace-e2e-vm runner keeps no-new-privileges (no sudo) and ships bubblewrap in
    # its image; seccomp/apparmor/systempaths are unconfined so bwrap can make its
    # PID namespace (fleet-ops-scripts ci-runners/e2e-vm). Closed gate or switch
    # off -> CI_E2E_RUNNER / Blacksmith exactly as before.
    # Two shards stay off the VM class (proof run 37170873916): hosts/test_libc_musl needs a docker
    # daemon (the class has no socket, so it skips and the suite reads red) and
    # core/test_fresh_process_entrypoints asserts doctor never probes systemctl, which it does when
    # /.dockerenv exists.
    runs-on: ${{ vars.CI_E2E_VM_ENABLED == 'true' && vars.CI_E2E_VM_ROUTE == 'open' && (github.event_name == 'push' || github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository) && matrix.shard != 'hosts/test_libc_musl' && matrix.shard != 'core/test_fresh_process_entrypoints' && fromJSON('["self-hosted","Linux","X64","ace-e2e-vm"]') || vars.CI_E2E_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-upgrade-plan.outputs.shards) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          # N-1 = `git describe --tags --abbrev=0 HEAD~1`.
          fetch-depth: 0
          fetch-tags: true

      - name: Persist the runner's git alternate
        # ace-e2e-vm runners (t_78d851d1) export GIT_ALTERNATE_OBJECT_DIRECTORIES so
        # checkout borrows objects from a host mirror. The suite spawns git with an
        # allowlisted env that drops that var, so its local "remote" could not read
        # them (run 37170424601: "Could not read 64eb1c8c"). Writing the alternate
        # into the repo makes it env-independent. No-op where the var is unset.
        run: |
          [ -n "${GIT_ALTERNATE_OBJECT_DIRECTORIES:-}" ] || exit 0
          printf '%s\n' "$GIT_ALTERNATE_OBJECT_DIRECTORIES" | tr ':' '\n' >> "$(git rev-parse --git-path objects/info/alternates)"
          git fsck --connectivity-only --no-progress >/dev/null 2>&1 || git count-objects -v

      - name: Fetch upstream release tags
        # Fork: the release tags (v2026.*) are cut on NousResearch/hermes-agent and this
        # repo's own tag list stops at v2026.5.7, so `git describe` on a parity ref named a
        # release whose uv.lock the pinned uv no longer resolves (`--locked` refused it in
        # run 37081194693). The nearest UPSTREAM release is the N-1 a user actually has.
        if: github.repository != 'NousResearch/hermes-agent'
        uses: ./.github/actions/retry
        with:
          command: git fetch --no-tags https://github.com/NousResearch/hermes-agent.git '+refs/tags/v20*:refs/tags/v20*'
          attempts: "5"
          delay: "30"

      - name: Set up Node
        # `hermes update` builds the web UI / TUI workspaces.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: 26

      - name: Install ripgrep (prebuilt binary)
        run: bash .github/scripts/install-ci-tool.sh ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          # Pin the uv version: unpinned, setup-uv resolves "latest" by
          # fetching a manifest from raw.githubusercontent.com on EVERY job —
          # a transient fetch failure fails the whole job (2026-07-28 slice-5
          # incident). Pinned, the binary downloads directly; no manifest hop.
          # Newer than the unit job's pin on purpose: 0.9.28 only knows CPython
          # 3.11.14, whose bundled SQLite has the WAL-reset bug, so Hermes runs
          # state.db in DELETE mode and the WAL torture chamber would skip.
          version: "0.12.13"
          # Persist uv's download/wheel cache (~/.cache/uv) across runs.
          # Keyed on the dependency manifests, so the cache is reused until
          # pyproject.toml or uv.lock changes. `uv sync` still runs every
          # time, but resolves from the warm cache instead of re-downloading
          # and re-building wheels.
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.14
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.14
          # python-build-standalone release assets 500 for minutes at a time
          # (merge group 36463111043, main push 36457723085; t_9081913e).
          attempts: "5"
          delay: "30"

      - name: Install dependencies
        # `uv sync --locked` installs the exact pinned set from uv.lock (and
        # fails if the lock is out of sync with pyproject.toml), giving a
        # reproducible env. It also creates .venv itself, so no separate
        # `uv venv` step is needed.
        #
        # Same extras as the test job's sync above: the hermetic test env
        # forbids mid-run pip installs (HERMES_DISABLE_LAZY_INSTALLS=1 in
        # tests/conftest.py), so lazy-install SDKs exercised by tests must be
        # in the venv up front.
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.14 --extra all --group dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra parallel-web

      - name: Install bubblewrap
        # Every spawned updater runs in bwrap (own PID namespace, no user
        # systemd bus, only the test tmp writable). Ubuntu 24.04 restricts
        # unprivileged user namespaces, which bwrap needs.
        run: |
          # The ace-e2e-vm image ships bwrap and its container has no sudo
          # (no-new-privileges): install/relax only where bwrap is missing.
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq bubblewrap
          fi
          sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          # The suite's own probe (_bwrap_usable, same flags as every sandboxed
          # run): without it the suite silently runs the updater unsandboxed.
          source .venv/bin/activate
          python -c "from tests.e2e.core.upgrade._helpers import BWRAP_OK; assert BWRAP_OK, 'bwrap unusable'" && echo "bwrap ok"

      - name: Require a WAL-capable SQLite
        # The state.db suites skip on a WAL-reset-vulnerable SQLite; fail
        # instead of reporting green over zero coverage.
        run: |
          source .venv/bin/activate
          python -c "import sqlite3, hermes_state_wal as w; print('sqlite', sqlite3.sqlite_version); assert not w.is_sqlite_wal_reset_vulnerable()"

      - name: Run upgrade e2e tests (${{ matrix.shard }})
        run: |
          set -euo pipefail
          source .venv/bin/activate
          # SHARD is "<suite>/<file-stem>" (per-file, the plan's default) or a
          # bare suite directory name (hand dispatch / older plans).
          case "$SHARD" in
            core/*)  mapfile -t files < <(ls "tests/e2e/core/upgrade/${SHARD#core/}.py") ;;
            */*)     mapfile -t files < <(ls "tests/e2e/core/upgrade/$SHARD.py") ;;
            core)    mapfile -t files < <(find tests/e2e/core/upgrade -maxdepth 1 -name 'test_*.py' | sort) ;;
            *)       mapfile -t files < <(find "tests/e2e/core/upgrade/$SHARD" -name 'test_*.py' | sort) ;;
          esac
          # A shard that collects nothing is a wiring bug, not a pass.
          [ "${#files[@]}" -gt 0 ] || { echo "no test files for shard $SHARD" >&2; exit 1; }
          printf 'shard %s: %s\n' "$SHARD" "${files[*]}"
          scripts/run_tests.sh --include-integration "${files[@]}"
        env:
          SHARD: ${{ matrix.shard }}
          # Each file drives real installs/updaters (process trees plus uv and
          # git I/O); cpu_count of them at once starves their deadlines. A
          # a per-file shard holds one file; 6 keeps a hand-dispatched suite
          # shard (<=7 files) in one wave. A single file never forks more.
          HERMES_TEST_WORKERS: "6"
          HERMES_TEST_FILE_TIMEOUT: "3000"
          # The hang detector (scripts/run_tests_parallel.py --idle-timeout,
          # default 240 s) measures SILENCE, and these files are silent for
          # long stretches by design: an N-1 `uv sync` from a cold cache, the
          # sandboxed updater's own dependency sync, the 1.8k-module import
          # sweep. In run 37081194693 it killed 3 files that pass alone in
          # 200-250 s. The wall ceiling above still gates a real hang.
          CI_TEST_IDLE_TIMEOUT: "1200"
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  # Required-work aggregate for this workflow. A reusable workflow whose inner
  # jobs were SKIPPED still reports success to ci.yaml's all-checks-pass, so a
  # skipped test/e2e (e.g. a broken fallback predicate) would be
  # skipped-success. This job turns any non-success generate/test/e2e result
  # into a visible failure (spec §3.7).
  tests-complete:
    name: Tests complete
    needs: [generate, placement, test, e2e, e2e-upgrade-plan, e2e-upgrade]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Quarantine evidence gate re-derives red->green pairs from the Actions API.
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Quarantine list lint + evidence gate
        # Spec I4 (p4 B1): any added / changed / later-until entry must cite
        # >= 2 red->green pairs that this step RE-DERIVES from the Actions API
        # (runs exist here, same head_sha, >= 2 distinct days, push /
        # merge_group / schedule junit naming the node, SHA an ancestor of
        # main). The checker runs from the BASE ref when the base has it, so a
        # PR that edits the checker and the list together is still checked by
        # the old checker.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
        run: |
          checker=scripts/ci/flake_quarantine.py
          base_args=()
          if git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            if git show "$BASE_SHA:scripts/ci/flake_quarantine.json" > "$RUNNER_TEMP/fq_base.json"; then
              base_args=(--base "$RUNNER_TEMP/fq_base.json")
            fi
            if git show "$BASE_SHA:scripts/ci/flake_quarantine.py" > "$RUNNER_TEMP/fq_base.py"; then
              checker="$RUNNER_TEMP/fq_base.py"
            fi
          fi
          python3 "$checker" check-changes "${base_args[@]}" \
            --head scripts/ci/flake_quarantine.json --repo "$REPO"
      - name: Fail on skipped or failed required tests
        # Results only: toJSON(needs) carries both matrices (~700 KB) and
        # exceeds the 128 KB per-env-string limit (E2BIG, run 35892732551).
        # e2e is a slow lane gated by inputs.e2e (ci.yaml passes the
        # classifier's answer): required when requested, a skip otherwise.
        env:
          GENERATE_RESULT: ${{ needs.generate.result }}
          TEST_RESULT: ${{ needs.test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_REQUESTED: ${{ inputs.e2e }}
        run: python3 scripts/ci_overflow_placement.py gate
      - name: Fail on skipped or failed e2e-upgrade shards
        # The upgrade shards are gated by inputs.e2e_upgrade (ci.yaml passes
        # the classifier's answer); when they were requested, a skip is a
        # wiring bug, not a pass.
        env:
          E2E_UPGRADE_REQUESTED: ${{ inputs.e2e_upgrade }}
          E2E_UPGRADE_PLAN_RESULT: ${{ needs.e2e-upgrade-plan.result }}
          E2E_UPGRADE_RESULT: ${{ needs.e2e-upgrade.result }}
        run: |
          if [ "$E2E_UPGRADE_REQUESTED" != true ]; then
            echo "e2e-upgrade not requested (plan=$E2E_UPGRADE_PLAN_RESULT, shards=$E2E_UPGRADE_RESULT)"
            exit 0
          fi
          if [ "$E2E_UPGRADE_PLAN_RESULT" != success ] || [ "$E2E_UPGRADE_RESULT" != success ]; then
            echo "::error::e2e-upgrade requested but plan=$E2E_UPGRADE_PLAN_RESULT shards=$E2E_UPGRADE_RESULT"
            exit 1
          fi
          echo "e2e-upgrade shards passed"
