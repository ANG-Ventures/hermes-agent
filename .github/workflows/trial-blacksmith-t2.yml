name: "Trial T2: Docker build GitHub gha-cache vs Blacksmith sticky builder (t_a928e796)"

# Measurement-only (kanban t_a928e796). Same Dockerfile/args as docker.yml's
# build step (amd64, load: true), no tests, no push, no secrets. Reps: run 1
# cold, run 2 = full re-run (same SHA), run 3 = one-line source change commit.
on:
  push:
    branches: [trial/blacksmith-t2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trial-blacksmith-t2-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: trial/hermes-agent

jobs:
  gh-x64:
    name: "GitHub x64 docker build"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image (amd64)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:test
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=trial-t2-amd64
          cache-to: type=gha,mode=max,scope=trial-t2-amd64

  bs-x64:
    name: "Blacksmith x64 docker build"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Blacksmith Docker builder (sticky BuildKit cache)
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
      - name: Build image (amd64)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:test
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
