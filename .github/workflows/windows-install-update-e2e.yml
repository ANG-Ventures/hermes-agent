name: Windows install + update E2E

# PR-time native Windows install/update journey (tests/e2e/core/windows_update):
# the real scripts/install.ps1 on a fresh fake user profile (git redirected to a local
# bare clone, no git/python/uv on PATH), then the real `hermes update` HEAD -> NEXT,
# a running gateway across that update, and a turn against the loopback provider.
# Each file walks one journey (one install) and asserts several user-visible cells;
# tracked bugs are message-gated xfails (tests/e2e/core/_pending_fixes.py).
#
# Called from tests-os.yml when a Python PR touches the install/update code
# (the classifier's e2e_upgrade lane) and on every push to main. Pushes to
# wine2e-install/** run it alone, for sabotage proofs and iteration without the
# rest of CI.

on:
  workflow_call:
  push:
    branches: ['wine2e-install/**']

permissions:
  contents: read

concurrency:
  group: windows-install-update-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-update:
    name: Windows install.ps1 + hermes update E2E (${{ matrix.leg }})
    # Fork: no windows-latest-32-core pool in this org.
    runs-on: windows-latest
    # One journey file per leg (6 legs). A file is one module-scoped fixture (install ->
    # update -> turns), so a file is the smallest unit a leg can hold, and its floor is one
    # install.ps1. Measured per file over runs 37105724870, 37151309078, 37157739858
    # (timings.json, 2 files per runner): install.ps1 650-1212 s; post-install test time
    # fresh 335-352 s (203-217 s of it waiting for gw's gateway-phase lock), gw 203-217 s,
    # git 108-126 s, interp 147-161 s, paths 239-446 s, spares 94-99 s (spares installs
    # two machines at once, 1087-1212 s). One file per runner removes the cross-file
    # gateway-phase wait and the second concurrent install on the same 4 vCPUs.
    # No shared install job: every fixture runs install.ps1 itself because the install is
    # the system under test (fresh: a clean machine without git; paths: a non-ASCII profile
    # with a space; spares: two installs on one host), each into its own fake profile.
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: fresh
            files: tests/e2e/core/windows_update/test_fresh_install_update.py
          - leg: gateway
            files: tests/e2e/core/windows_update/test_gateway_across_update.py
          - leg: git-holders
            files: tests/e2e/core/windows_update/test_git_and_holders.py
          - leg: interpreter
            files: tests/e2e/core/windows_update/test_interpreter.py
          - leg: paths-acls
            files: tests/e2e/core/windows_update/test_paths_and_acls.py
          - leg: spares
            files: tests/e2e/core/windows_update/test_update_spares_other_installs.py
            # Two install.ps1 at once on 4 vCPUs: the slowest leg by design. Its test step
            # over 159 green runs (2026-09-29..10-06): p50 1022 s, p90 1245 s, max 1795 s,
            # five above 1500 s, so the shared 1800 s file timeout sat at its max and killed a
            # still-progressing run (37428113550, main 86e289df). ~1.5x the observed max, and
            # the job wall grows by the same 15 min so the file timeout still fires first; idle
            # stays above the file timeout (silence is not a hang signal here, see the step env).
            file_timeout: '2700'
            idle_timeout: '3000'
            timeout: 59
    # 2x the measured p90 leg wall: 17 green legs over runs 37168966958, 37169022868,
    # 37170959667 had wall 650-1403 s (p90 1297 s), test step 494-1006 s (p90 812 s) and
    # setup (checkout + setup-pm) 89-565 s (565 s on a cold cache). The per-file timeout
    # (2x the test-step p90, rounded up) plus the cold setup max stays under this wall, so a
    # stuck file is killed and named before the job wall cancels the leg blind.
    # spares overrides both budgets (see its matrix row).
    timeout-minutes: ${{ matrix.timeout || 44 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          # serve.git is a bare clone of this checkout: the installer's treeless clone and
          # `hermes update` need real history and release tags (version identity), as on GitHub.
          fetch-depth: 0

      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          packages: git,ripgrep
          extras: '["all", "telegram", "anthropic", "mistral", "fal", "modal", "daytona", "parallel-web"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Run Windows install + update E2E
        shell: bash
        run: |
          scripts/run_tests.sh ${{ matrix.files }} -- \
            -m "platforms and integration" -v --tb=short -rA
        env:
          HERMES_E2E_WINDOWS_INSTALL: '1'
          # Machine work dirs (serve.git, transcripts) stay short under runner.temp. The fake
          # user profiles live in C:\Users itself, where a real one does: the checkout carries
          # 159-character paths, so a deeper profile hits MAX_PATH where no user would (the
          # runner is disposable, so writing C:\Users is fine).
          HERMES_E2E_MACHINE_ROOT: ${{ runner.temp }}\wm
          HERMES_E2E_PROFILES_ROOT: C:\Users
          HERMES_E2E_ARTIFACTS: ${{ runner.temp }}\win-update-e2e
          # Upstream runs one journey per file, all six in parallel, on a 32-core pool. On the
          # 4-vCPU hosted runner six concurrent install.ps1 (toolchain unpack + uv sync + npm ci)
          # are CPU-bound: install.ps1 reached "Preparing Node dependencies" at 1246-1405 s and
          # every journey hit INSTALL_TIMEOUT=1500 (run 37100414187, 0/18). With 2 workers the
          # install takes 870-1015 s and the cells pass (run 37102491348: 15/15 across the 4
          # files that finished inside the old job wall).
          HERMES_TEST_WORKERS: '2'
          HERMES_TEST_FILE_TIMEOUT: ${{ matrix.file_timeout || '1800' }}
          # Six journeys each run install.ps1 (a cold PM toolchain + venv + Node deps) on a
          # 4-vCPU hosted runner. A journey is one module-scoped fixture (install -> update
          # -> turns) that runs BEFORE its first cell can print, so pytest is silent for the
          # whole walk: 730-1025 s per file on upstream's 32-core pool (run 36307037128),
          # longer here. The fork's idle hang detector (scripts/run_tests_parallel.py
          # --idle-timeout; upstream has none on this job) killed all six at 269 s (240 s,
          # run 37081194693) and again at 1229 s (1200 s, run 37094436303). Silence is not
          # a hang signal for this suite: let the wall ceiling alone gate it, as upstream does.
          CI_TEST_IDLE_TIMEOUT: ${{ matrix.idle_timeout || '2400' }}
          HERMES_TEST_FILE_RETRIES: '0'
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''

      - name: Upload transcripts, logs and receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-install-update-e2e-${{ matrix.leg }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/win-update-e2e
          if-no-files-found: ignore
          retention-days: 14

      - name: No leftover Python / Hermes processes
        # Backstop for each journey's teardown: nothing a machine started may outlive it.
        if: always()
        shell: pwsh
        run: |
          $names = 'python.exe', 'pythonw.exe', 'hermes.exe', 'node.exe'
          # Work dirs live under runner.temp\wm; profiles are C:\Users\*hermes-e2e-<id>.
          $root = "${{ runner.temp }}\wm".ToLower()
          $profileMark = 'hermes-e2e-'
          $deadline = (Get-Date).AddSeconds(20)
          do {
            $left = @(Get-CimInstance Win32_Process | Where-Object {
              $blob = "$($_.CommandLine) $($_.ExecutablePath)".ToLower()
              ($names -contains $_.Name.ToLower()) -and ($blob.Contains($root) -or $blob.Contains($profileMark))
            })
            if ($left.Count -eq 0) { 'no leftover processes from the E2E machines'; exit 0 }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)
          foreach ($p in $left) {
            "::error::leftover pid=$($p.ProcessId) ppid=$($p.ParentProcessId): $($p.CommandLine)"
          }
          exit 1
