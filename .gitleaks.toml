  '''tests/hermes_cli/test_xiaomi_provider\.py''',    # Xiaomi provider-gate fake sk- keys
  '''tests/gateway/test_discord_plugin_setup\.py''',  # DISCORD_HOME_CHANNEL snowflake fixture — discord-client-id FP
  '''tests/gateway/test_api_server_bind_guard\.py''', # bind-guard fake sk-test key
