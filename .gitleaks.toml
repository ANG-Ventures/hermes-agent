  '''tests/hermes_cli/test_agent_import\.py''',               # ghp_SE…T123 fake GitHub PAT
  '''tests/hermes_cli/test_arcee_provider\.py''',             # arc-te…2345 fake Arcee key
  '''tests/hermes_cli/test_ollama_cloud_auth\.py''',          # test-o…2345 fake Ollama Cloud key
  '''tests/hermes_cli/test_tencent_tokenhub_provider\.py''',  # sk-tes…5678 fake Tencent keys (x2)
  '''tests/run_agent/test_reset_aware_primary_restore\.py''', # test-k…5678 fake primary-restore key
  '''tests/skills/test_google_workspace_api\.py''',           # ya29.i…cted redacted-OAuth-token fixture
  # Non-test sources — verified FPs, NOT credentials:
  '''plugins/context_engine/lcm/assertion_store\.py''',       # matches `allow_empty=True` kwarg, not a secret
  '''scripts/toolperf_abeval/ab_eval\.py''',                  # synthetic build-log marker `UNIQUE_TOKEN=tok_9f31c_middle`
  '''optional-skills/productivity/telephony/scripts/telephony\.py''',  # PUBLIC ElevenLabs voice ID (cjVigY5qzO86Huf0OWal, "Eric")
