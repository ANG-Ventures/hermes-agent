name: kanban-home-cards
version: "0.1.0"
description: "Once per (process, session), prepend a compact, capped list of this session's OPEN home kanban cards to the first user turn (pre_llm_call context -> user-message api_content sidecar; never the system prompt). Skips kanban workers, delegate children and cron. Read-only, fail-open, 750 ms budget. Opt-in via `hermes plugins enable kanban-home-cards`."
author: NousResearch
hooks:
  - pre_llm_call
